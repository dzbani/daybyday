<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalendarz szkolny — DaybyDay</title>
<meta name="robots" content="noindex, nofollow">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  body { font-family: Georgia, serif; color: #1A1916; padding: 14px 16px; font-size: 14px; line-height: 1.5; }
  .card { border: 1px solid #E8E5E0; border-radius: 12px; padding: 14px 16px; background: #FFFFFF; }
  .label { font-size: .66rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #8A8680; margin: 0 0 .3rem; }
  .status { font-size: 1.15rem; font-weight: 600; margin-bottom: .7rem; }
  .status .emoji { margin-right: .3rem; }
  .next-label { font-size: .95rem; }
  .next-date { font-size: .78rem; color: #6B6762; margin-top: .15rem; }
  a { color: #1A1916; }
  .brand { display: block; margin-top: .75rem; padding-top: .6rem; border-top: 1px solid #E8E5E0; font-size: .7rem; color: #8A8680; text-decoration: none; font-family: Georgia, serif; }
  .brand b { color: #1A1916; }
</style>
</head>
<body>
  <div class="card" id="dbdCard">
    <div class="label">Kalendarz szkolny</div>
    <div class="status" id="dbdStatus">—</div>
    <div id="dbdNext"></div>
    <a class="brand" href="https://daybyday.today/kalendarz-szkolny.html" target="_top">Kalendarz szkolny — <b>DaybyDay.today</b></a>
  </div>
<script>
(function(){
  // Kluczowe daty lat szkolnych 2025/2026 i 2026/2027. Utrzymywane ręcznie, tak samo
  // jak zrodlowa strona kalendarz-szkolny.html (brak automatycznego generatora — patrz
  // ten sam plik). Ferie zimowe zaleza od wojewodztwa, wiec pokazane jako jeden zbiorczy
  // zakres z dopiskiem, zamiast probowac zgadywac wojewodztwo widza.
  var EVENTS = [
    {start:'2025-09-01', end:'2025-09-01', label:'Rozpoczęcie roku szkolnego', type:'szkolny', emoji:'🎒'},
    {start:'2025-10-14', end:'2025-10-14', label:'Dzień Edukacji Narodowej — dzień wolny', type:'wolny', emoji:'📕'},
    {start:'2025-11-01', end:'2025-11-01', label:'Wszystkich Świętych', type:'wolny', emoji:'🕯️'},
    {start:'2025-11-11', end:'2025-11-11', label:'Narodowe Święto Niepodległości', type:'wolny', emoji:'🇵🇱'},
    {start:'2025-12-22', end:'2025-12-31', label:'Przerwa świąteczna', type:'przerwa', emoji:'🎄'},
    {start:'2025-12-24', end:'2025-12-24', label:'Wigilia — dzień wolny', type:'wolny', emoji:'🎄'},
    {start:'2025-12-25', end:'2025-12-26', label:'Boże Narodzenie', type:'wolny', emoji:'🎄'},
    {start:'2026-01-01', end:'2026-01-01', label:'Nowy Rok', type:'wolny', emoji:'🎉'},
    {start:'2026-01-06', end:'2026-01-06', label:'Trzech Króli — dzień wolny', type:'wolny', emoji:'👑'},
    {start:'2026-01-19', end:'2026-03-01', label:'Ferie zimowe (dokładne daty zależą od województwa)', type:'ferie', emoji:'⛄'},
    {start:'2026-04-02', end:'2026-04-07', label:'Przerwa wielkanocna', type:'przerwa', emoji:'🐣'},
    {start:'2026-04-05', end:'2026-04-06', label:'Wielkanoc', type:'wolny', emoji:'🐣'},
    {start:'2026-05-01', end:'2026-05-01', label:'Święto Pracy', type:'wolny', emoji:'🏳️'},
    {start:'2026-05-03', end:'2026-05-03', label:'Święto Konstytucji 3 Maja', type:'wolny', emoji:'🇵🇱'},
    {start:'2026-05-24', end:'2026-05-24', label:'Zielone Świątki', type:'wolny', emoji:'🕊️'},
    {start:'2026-06-04', end:'2026-06-04', label:'Boże Ciało', type:'wolny', emoji:'⛪'},
    {start:'2026-06-26', end:'2026-06-26', label:'Zakończenie roku szkolnego', type:'szkolny', emoji:'🎓'},
    {start:'2026-06-27', end:'2026-08-31', label:'Wakacje letnie', type:'wakacje', emoji:'🏖️'},
    {start:'2026-09-01', end:'2026-09-01', label:'Rozpoczęcie roku szkolnego 2026/2027', type:'szkolny', emoji:'🎒'},
    {start:'2026-10-14', end:'2026-10-14', label:'Dzień Edukacji Narodowej — dzień wolny', type:'wolny', emoji:'📕'},
    {start:'2026-11-01', end:'2026-11-01', label:'Wszystkich Świętych', type:'wolny', emoji:'🕯️'},
    {start:'2026-11-11', end:'2026-11-11', label:'Narodowe Święto Niepodległości', type:'wolny', emoji:'🇵🇱'},
    {start:'2026-12-23', end:'2026-12-31', label:'Przerwa świąteczna', type:'przerwa', emoji:'🎄'},
    {start:'2026-12-24', end:'2026-12-24', label:'Wigilia — dzień wolny', type:'wolny', emoji:'🎄'},
    {start:'2026-12-25', end:'2026-12-26', label:'Boże Narodzenie', type:'wolny', emoji:'🎄'},
    {start:'2027-01-01', end:'2027-01-01', label:'Nowy Rok', type:'wolny', emoji:'🎉'},
    {start:'2027-01-06', end:'2027-01-06', label:'Trzech Króli — dzień wolny', type:'wolny', emoji:'👑'},
    {start:'2027-01-18', end:'2027-02-28', label:'Ferie zimowe (dokładne daty zależą od województwa)', type:'ferie', emoji:'⛄'},
    {start:'2027-03-25', end:'2027-03-30', label:'Przerwa wielkanocna', type:'przerwa', emoji:'🐣'},
    {start:'2027-03-28', end:'2027-03-29', label:'Wielkanoc', type:'wolny', emoji:'🐣'},
    {start:'2027-05-01', end:'2027-05-01', label:'Święto Pracy', type:'wolny', emoji:'🏳️'},
    {start:'2027-05-03', end:'2027-05-03', label:'Święto Konstytucji 3 Maja', type:'wolny', emoji:'🇵🇱'},
    {start:'2027-05-16', end:'2027-05-16', label:'Zielone Świątki', type:'wolny', emoji:'🕊️'},
    {start:'2027-05-27', end:'2027-05-27', label:'Boże Ciało', type:'wolny', emoji:'⛪'},
    {start:'2027-06-25', end:'2027-06-25', label:'Zakończenie roku szkolnego', type:'szkolny', emoji:'🎓'},
    {start:'2027-06-26', end:'2027-08-31', label:'Wakacje letnie', type:'wakacje', emoji:'🏖️'},
    // 1 września 2027 to środa (dzień powszedni) — zgodnie z ustawową regułą (pierwszy dzień
    // powszedni września) rok szkolny 2027/2028 rozpocznie się właśnie tego dnia. Bez tego wpisu
    // sekcja "Za X dni" byłaby pusta przez całe lato 2027 (jedyne w całej tablicy), bo to ostatnie
    // wydarzenie w danych i nie ma kolejnego, do którego można by odliczać.
    {start:'2027-09-01', end:'2027-09-01', label:'Rozpoczęcie roku szkolnego 2027/2028', type:'szkolny', emoji:'🎒'}
  ];

  function parseDate(s){ var p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function fmtDate(d){
    var MONTHS = ['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
    return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  }

  var today = new Date(); today.setHours(0,0,0,0);
  var current = null, next = null, dataEnd = null;
  for (var i = 0; i < EVENTS.length; i++) {
    var e = EVENTS[i], s = parseDate(e.start), en = parseDate(e.end);
    if (today >= s && today <= en) current = e;
    if (s > today && (!next || s < parseDate(next.start))) next = e;
    if (!dataEnd || en > dataEnd) dataEnd = en;
  }

  var statusEl = document.getElementById('dbdStatus');
  var nextEl = document.getElementById('dbdNext');

  if (current) {
    statusEl.innerHTML = '<span class="emoji">' + current.emoji + '</span>Dziś: ' + current.label;
  } else if (today > dataEnd) {
    // Poza zakresem znanych dat (nowy rok szkolny bez wpisanych jeszcze terminów) —
    // nie zgadujemy dnia nauki/ferii, tylko odsyłamy do pełnego, aktualizowanego kalendarza.
    statusEl.innerHTML = '<span class="emoji">🗓️</span>Sprawdź aktualny kalendarz szkolny';
  } else {
    var day = today.getDay(); // 0=niedz, 6=sob
    if (day === 0 || day === 6) {
      statusEl.innerHTML = '<span class="emoji">🗓️</span>Weekend';
    } else {
      statusEl.innerHTML = '<span class="emoji">📚</span>Dziś dzień nauki szkolnej';
    }
  }

  if (next) {
    var days = Math.round((parseDate(next.start) - today) / 86400000);
    nextEl.innerHTML = '<div class="next-label">' + next.emoji + ' Za ' + days + ' ' + (days === 1 ? 'dzień' : 'dni') + ': ' + next.label + '</div><div class="next-date">' + fmtDate(parseDate(next.start)) + '</div>';
  }
})();
</script>
</body>
</html>
