const PROVERBS_DB = {"1-1":["Jak Nowy Rok jasny i chłodny, będzie roczek pogodny i płodny.","Gdy na Nowy Rok plucha, ze żniwem też będzie pokuta.","Gdy na Nowy rok jasno, to w gumnach będzie ciasno."],"1-2":["Gdy Makary pogodny cały styczeń chłodny.","Makary jasny, będzie wrzesień krasny"],"1-3":["Od Genowefy listopad swój bierze początek."],"1-4":["Gdy w Eugeniego lód albo woda taka i lipcowa pokaże się pogoda."],"1-5":["Gdy styczeń burzliwy z śniegami lato burzliwe z deszczami."],"1-6":["Gdy trzech Króli mrozem trzyma będzie jeszcze długa zima.","Na Trzech Króli słońce świeci, wiosna do nas pędem leci.","Gdy Trzy Króle pogodą obdarzą, nie zasypiaj ranków gospodarzu."],"1-7":["Jeśli w styczniu deszcze leją nie ciesz się wielką nadzieją.","Po styczniu jasnym i białym będą w lato upały."],"1-8":["Kiedy w styczniu rośnie trawa marna w lecie jest potrawa.","Gdy w zimie nie było śniegu to go wiele spadnie w kwietniu."],"1-9":["Styczeń, styczeń wszystko studzi – ziemię, bydło, ludzi."],"1-10":["Gdy słońce przygrzewa na Jana Dobrego spodziewać się można lata pogodnego."],"1-11":["Święta Honorata figle płata."],"1-12":["Kiedy w styczniu rosną trawy lipiec dla nas niełaskawy."],"1-13":["Weronika chustkę zrzuci wiosna od nas się odwróci."],"1-14":["Kiedy ptaki w styczniu śpiewają to im w maju dzioby zamarzają.","Jak Feliks mroźny, tak i luty groźny."],"1-15":["Ciepła izba marzeń szczytem i tak jakoś mija styczeń.","Jeśli w Święty Paweł śnieg albo deszcz pada, dobrych urodzajów spodziewać wypada."],"1-16":["Jaka pogoda w Świętego Marcela będzie pogodna Wielka Niedziela."],"1-17":["Jak styczeń zachlapany to lipiec zapłakany."],"1-18":["Gdy na Małgorzaty mróz, jeszcze długo nie pojedzie wóz."],"1-19":["Święty Józef pogodny, będzie roczek urodny","Gdy Styczeń z zimnem nie chodzi marzec, kwiecień wychłodzi."],"1-20":["Fabian i Sebastian gdy mróz dadzą srogą zimę przyprowadzą."],"1-21":["Jak Święta Agnieszka wypuści śnieg z mieszka, to go nie powstrzyma ani do Franciszka (24 sty.).","Agnieszka li łaskawa, wkrótce w polu zabawa; Agnieszka li nielusa, jeszcze zimie pokusa.","Agnieszka łaskawa puszcza skowronka z rękawa."],"1-22":["Gdy na Wincentego i nawrócenie Pawła (25 sty.) pogoda świeci spodziewajcie się dobrego lata dzieci."],"1-23":["W styczniu łów łatwy na kuropatwy."],"1-24":["Na Świętego Tymoteusza trzeba ci czapki nie kapelusza."],"1-25":["Na Świętego Pawła połowa zimy przepadła.","Gdy na święty Paweł jasno, po żniwach w stodole ciasno.","Jeśli w święty Paweł śnieg albo deszcz pada, dobrych się urodzajów spodziewać wypada."],"1-26":["Kiedy w styczniu lato w lecie zimno za to."],"1-27":["Kiedy styczeń najostrzejszy tedy roczek najpłodniejszy."],"1-28":["Na Świętego Karola wyjrzy spod śniegu rola.","Urodzaje da rola gdy deszcz leje w Karola."],"1-29":["Na Świętego Franciszka przylatuje pliszka."],"1-30":["Św. Marcin lody gładzi, gdy ich nie ma to je sadzi.","Na Świętą Martynę przybyło dnia na godzinę."],"1-31":["Na Świętego Ludwika koń na grudzie utyka."],"2-1":["Czasem się luty zlituje że człek niby wiosnę czuje, ale czasem się tak zżyma że człek prawie nie wytrzyma.","Idzie luty, podkuj buty.","Gdy mróz w lutym ostro trzyma, tedy jest niedługa zima."],"2-2":["Gdy w Gromnice pięknie wszędzie, tedy dobra wiosna będzie.","Gromnice w śniegu, wiosna jest w biegu, lecz gdy pogoda, dla wiosny zawoda.","Gdy w Gromnicę z dachów ciecze, zima jeszcze się przewlecze."],"2-3":["Jak pogoda w św. Błażeja, będzie ze śniegiem Wielka Niedziela.","Jak śnieg na św. Błażeja, pogodna będzie Wielka Niedziela.","Deszcz na świętego Błażeja, słaba wiosny nadzieja."],"2-4":["Gdy ciepło w lutym, zimno w marcu bywa, długo potrwa zima, rzecz to niewątpliwa."],"2-5":["Gdy św. Agata po błocie brodzi, człek w Zmartwychwstanie po lodzie chodzi.","Po świętej Agacie wyschną na słońcu gacie.","Święta Agata chatę wymiata."],"2-6":["Po Św. Dorocie wyschną chusty na płocie, a jak nie wyschną, to człeka mrozy do chałupy wepchną.","Rzadki dzień świętej Doroty bez mrozu, zawiei, słoty.","Święta Dorota wypuszcza skowronka za wrota."],"2-7":["Kiedy w lutym rosa pada, nowe mrozy zapowiada."],"2-8":["Jak luty nastaje, śnieg jeszcze nie taje."],"2-9":["Gdy mróz w lutym ostro trzyma, tedy już niedługa zima."],"2-10":["Na św. Jacenty - łamią się pod lodem pręty.","Święta Scholastyka zaśnieżonymi drogami spyka."],"2-11":["Jeśli luty śnieżny, mroźny, spodziewaj się wczesnej wiosny."],"2-12":["Na świętego Ludwika na grudzie koń utyka."],"2-13":["Gdy w lutym do połowy zima się wysili, to na koniec miesiąca już się nie wychyli."],"2-14":["Gdy na święty Walek deszcze, mrozy wrócą jeszcze.","Jak Walenty nie poleje, to na wiosnę masz nadzieję.","Gdy na św. Walenty mróz, chowaj sanie, szykuj wóz."],"2-15":["Czasem luty ostro kuty, czasem w luty same pluty."],"2-16":["Luty, gdy wiatrów i mrozów nie daje, sprowadzi rok słotny i nieurodzaje.","Święty Maciej zimę traci, albo ją bogaci."],"2-17":["Jeśli ci jeszcze nie dokuczył luty, to pal dobrze w kominie i miej kożuch suty."],"2-18":["Luty bywa w lód okuty."],"2-19":["W świętego Konrada, zima nie rada."],"2-20":["W lutym, gdy zagrzmi od wschodniego boku, burze i wiatry częste są w tym roku."],"2-21":["Kiedy kot w lutym na słonku się grzeje, musi w marcu zajść na przypiecek."],"2-22":["Gdy mróz w lutym dwudziestym drugim, dzień straszy nas mrozem długim.","Zimno w Piotra Stolicę, czterdzieści dni takich naliczę."],"2-23":["Silne wiatry przy końcu lutego, spodziewaj się zatem lata żyznego."],"2-24":["Jak w Święty Maciej ciepło, to się będzie długo wlekło.","Na świętego Macieja pierwsza wiosny nadzieja.","Święty Maciej zimę traci albo ją bogaci."],"2-25":["Skoro po Macieju drzewa się ogrzeją, leć do sadu, oczyść go z owadów."],"2-26":["Gdy wiatr ostro w lutym wieje, chłop ma dobrą nadzieję."],"2-27":["Luty stały, latem upały."],"2-28":["W lutym wiele wody - całe lato bez pogody."],"2-29":["Suchy grudzień stoi za to, że sucha będzie wiosna i suche lato."],"3-1":["Na Świętego Albina rzadka u ludzi mina, bo post się zaczyna."],"3-2":["Czasem i w marcu, zetnie wodę w garncu."],"3-3":["Gdy marzec mglisty, w lecie czas dżdżysty."],"3-4":["Dzień świętego Kazimierza resztki zimy uśmierza.","Jeżeli na świętego Kazimierza pogoda, to na ziemniaki woda (na wykopki).","Na świętego Kazimierza pełno już młodego zwierza."],"3-5":["Gdy marzec suchy, kwiecień nagradza, bo deszcze sprowadza."],"3-6":["Gdy w marcu grzmi, w maju śniegiem cmi."],"3-7":["Gdy w marcu topnieje, to na wiosnę mróz bieleje."],"3-8":["Deszcze marcowe zbożu niezdrowe."],"3-9":["Gdy Franciszka z wichrem po polu hasa, może sypnąć śniegiem powyżej pasa."],"3-10":["Gdy mróz w marcu dnia dziesiątego, jeszcze czterdzieści dni mrozu takiego.","Czterdziestu Męczenników jakich, czterdzieści dni po nich takich","Kiedy na Czterdziestu Męczenników marznie, to jeszcze czterdzieści nocy przymarznie."],"3-11":["Jeśli zapusty pogodne bywają, Świąt wielkanocnych tak się spodziewają."],"3-12":["Na Świętego Grzegorza idzie zima do morza.","Na świętego Grzegorza szuka kawka łoża","Groch święty Grzegorz zasiewa, soczewicę Jakub miewa."],"3-13":["Gdy w marcu niebo od południa ryknie, rok wszego dobra z tego wyniknie."],"3-14":["W marcu, gdy są grzmoty, urośnie zboże ponad płoty."],"3-15":["Gdy w marcu deszcz pada, wtedy rolnik biada, gdy słonko jaśnieje, to rolnik się śmieje."],"3-16":["Hilary zapowiada, jaka pogoda w Wielkanoc przypada."],"3-17":["Gdy na Gertrudy zjawią się bociany, to wiosna już rychło nastanie.","Ogrodniku, św. Gertruda gdy słońcem błyśnie zrobi cuda oczywiście."],"3-18":["Na św. Edwarda zimy pogarda."],"3-19":["Gdy na święty Józef bociek przybędzie, to już śniegu nie będzie.","Na świętego Józefa pięknie, zima prędko pęknie.","Święty Józef pogodny, będzie roczek wodny."],"3-20":["Od dnia dwudziestego marca zagrzewa słońce nawet starca."],"3-21":["Jak po Benedykcie ciepło, to i w lecie będzie piekło.","Benedykt groch w polu sieje, Wojciech (23 kwi.) do owsa się śmieje.","Benedykta Bożą mocą, dzionek już się równa z nocą."],"3-22":["Jeżeli w pierwszy dzień po przesileniu marcowym burza się zdarzy, zima już nie przydarzy."],"3-23":["Marzec zimny i słoneczny, plon zaręcza dostateczny."],"3-24":["Na Świętego Szymona nie wdziewaj już kaftana."],"3-25":["Jakie jest Zwiastowanie, takie będzie i Zmartwychwstanie.","Gdy przed Zwiastowaniem ruszy się pszczoła, to mokrą wiosnę nam przywoła.","Na Zwiastowanie jaskółki się ukazują, ludziom wiosnę zwiastują."],"3-26":["Ile mgieł w marcu, tyle deszczów w czerwcu."],"3-27":["Suchy marzec, mokry maj, będzie żytko jako gaj."],"3-28":["Gdy w marcu deszcz pada, wtedy rolnik biada, gdy słońce jaśnieje, to rolnik się śmieje."],"3-29":["Kiedy w marcu plucha, to w maju posucha."],"3-30":["Gdy w marcu mgły bywają, w lecie burze przeszkadzają."],"3-31":["Co marzec wypiecze, to kwiecień wyciecze."],"4-1":["W prima aprilis się omylisz, gdzie postąpisz, gdzie się schylisz.","Pierwszy kwietnia - bajów pletnia."],"4-2":["Na św. Franciszka nieraz dobrze grzmi i łyska.","Na św. Franciszka zielenią się łany i ze swego zimowiska wracają bociany.","Na Świętego Franciszka przylatuje pliszka."],"4-3":["Kiedy w kwietniu grzmoty, szron już nie ma roboty.","Jeżeli w kwietniu posuszy, nic się w polu nie ruszy."],"4-4":["Na Świętego Izydora dla bociana pora."],"4-5":["Chociaż św. Wincenty, jednak szczypie mróz w pięty.","Jak się Wincenty rozdeszczy, źle chłopu wilga wieszczy.","Na św. Wincenty nie chodź bosymi pięty, bo nieraz mrozek cięty."],"4-6":["Kwiecień-plecień, bo przeplata, trochę zimy, trochę lata.","W kwietniu posusza, nic się na polach nie rusza.","Suchemu kwietniowi chłop się nie raduje, bo kwiecień mokry dobry rok zwiastuje."],"4-7":["Choć i w kwietniu słonko grzeje, nieraz pole śnieg zawieje."],"4-8":["Jaka na Julii pogoda, taką Wielkanoc poda."],"4-9":["Choć już w kwietniu słonko grzeje, nieraz pole śnieg zawieje.","W kwietniu łagodne kwiatki, w grudniu śnieżne płatki."],"4-10":["Dzień na święty Makary pewnie przepowiada, czy we wrześniu pogoda, czy też ciągle pada."],"4-11":["Grzmot w kwietniu dobra nowina, już szron roślin nie pościna."],"4-12":["Kwiecień, co deszczem rosi, wiele owoców przynosi."],"4-13":["Jeśli w kwietniu pszczoły nie latają, to jeszcze długie chłody się zapowiadają."],"4-14":["Na Świętego Justyna siew się w polu zaczyna."],"4-15":["W kwietniu posucha, niknie rolnikom otucha.","Kwiecień, kiedy deszczem plecie, to się maj wystroi w kwiecie."],"4-16":["Kwiecień wilgotny obiecuje rok stokrotny."],"4-17":["Kwiecień czasem kwieciem ściele, albo śniegiem przyjaciele."],"4-18":["Gdy w kwietniu słonko na dworze, nie będzie pustek w komorze."],"4-19":["Chcesz mieć kęs płótna dobrego, siej len na św. Jerzego."],"4-20":["Jak w kwietniu rosa, to dosiewaj chłopie mocno prosa."],"4-21":["Gdy w kwietniu ciepłe deszcze padają, pogodną jesień zapowiadają."],"4-22":["Kiedy w kwietniu słonko grzeje, rolnik nie zubożeje."],"4-23":["Gdy na św. Wojciecha rano deszcz pada, do połowy lata suszę zapowiada.","Ile razy przed Wojciechem zagrzmi na pola, tyle razy po Wojciechu zabieli się rola.","Gdy przed Wojciechem grzmi, długo jeszcze ziemia śni"],"4-24":["Jak w kwietniu mróz, to na pagórku siana wóz.","Ta urodzajna pszenica bywa, która w kwietniu przepiórkę przykrywa."],"4-25":["Chodzisz na Marka bez koszuli, w maju kożuchem się otulisz.","Na św. Marka deszcz, to suchego lata wieszcz."],"4-26":["Mokre dni kwietnia zazwyczaj wróżą, że w lecie będzie owoców dużo.","Za kwietniem ciepłym idzie maj chłodny."],"4-27":["Śnieg w kwietniu goi rolę, hamuje niedolę.","Kwiecień daje zieleń trawce, gra pastuszek na igrawce."],"4-28":["Deszcze częste w kwietniu wróżą, że owoców będzie dużo."],"4-29":["Kwiecień co deszczem rosi, wiele owoców przynosi."],"4-30":["Gdy kwiecień chmurny, a maj z wiatrami, rok żyzny przed nami."],"5-1":["Pierwszego maja deszcz, nieurodzajów wieszcz.","Na pierwszego maja szron, obiecuje hojny plon."],"5-2":["W Zygmunta deszcz - nieurodzaju wieszcz."],"5-3":["Maj zieleni łąki, drzewa, już i ptaszek w polu śpiewa."],"5-4":["Kiedy poleje na świętego Floriana, potrwa czas jakiś pogoda zakichana.","Deszcze w świętego Floriana, skrzynia groszem napchana.","Na Floriana bywa żyto po kolana"],"5-5":["Maj bogaty sieje kwiaty."],"5-6":["Kiedy w Filipa i Jakuba deszcz pada, suchy rok będzie; kiedy nie pada - mokry będzie.","Na Filipa, gdy przymrozek spadnie, najgorsza zaraza na zboże przypadnie.","Na świętego Filipa jeśli deszcz rzęsisty, będzie plon dobry i czysty."],"5-7":["Gizela święta zimy nie pamięta."],"5-8":["Na świętego Stanisława rośnie koniom trawa.","Na świętego Stanisława w domu pustki, w polu sława."],"5-9":["Gdy w maju śnieg pada, suszę zapowiada."],"5-10":["Kiedy mokry maj, będzie żyto jako gaj."],"5-11":["Gdy przed Pankracym przymrozek nocny się zdarzy, zimno wiosnę zwarzy.","Gdy przed Pankracym nocą przymrozi, lato będzie przepadziste, a jesienią czasy dżdżyste."],"5-12":["Pankracy, Serwacy i Bonifacy – źli na ogrody chłopacy","Pankracy, Serwacy, Bonifacy, każdy swoim zimnem raczy","Przed Pankracym nie ma lata, po Bonifacym mróz ulata."],"5-13":["Gdy słoneczko przed Serwacym ciepło juz dogrzewa, po Serwacym szron pokryje i kwiaty i drzewa.","Jak się rozsierdzi Serwacy, to wszystko zmrozi i przeinaczy."],"5-14":["Pankracy, Serwacy i Bonifacy gdy z przymrozkiem stają, lato zimne dają.","Pankracy, Serwacy, Bonifacy, każdy swoim zimnem raczy."],"5-15":["Na świętą Zofiję deszcz po polach bije.","Gdy w Zofię zboże do pasa, na zimę chleb i okrasa.","Dla świętej Zosi kłos się podnosi"],"5-16":["Niedługo trwa deszcz majowy, tyle, co łzy młodej wdowy."],"5-17":["Kiedy w maju wiatr z północy, ma się u nas zimno w nocy."],"5-18":["Grzmot w maju, sprzyja urodzaju."],"5-19":["Na Urbana chwile jakie, mówią, ze i lato takie.","W Urbana, miły chłopie, siej len i konopie.","Na świętego Urbana wszystka rola zasiana."],"5-20":["Gdy Bernard grzmi i deszczy, czerwiec z pogodą, a lipiec z wodą."],"5-21":["Na Jana Nepomucena wiadoma już zboża cena."],"5-22":["Jeśli w maju śnieg się zdarzy, to lato dobrze wyparzy."],"5-23":["Gdy w maju żołądź dobrze okwita, dobry rok zawita."],"5-24":["Gdy w Zuzannę burze, jesienią pełne podwórze."],"5-25":["Jak w maju plucha, to w czerwcu posucha."],"5-26":["Wody w maju stojące szkodę przynoszą łące."],"5-27":["Częste deszcze w całym maju chleb i siano nam dawają."],"5-28":["Jeśli deszcze w maju, wszystko rośnie jak w gaju."],"5-29":["Jeśli w maju grzmot, rośnie wszystko w lot."],"5-30":["Kiedy maj zimny, a w czerwcu deszcz pada, gospodarz pełne stodoły posiada."],"5-31":["Deszcz na Nawiedzenie Panny potrwa pewno do Zuzanny."],"6-1":["Czerwiec na maju zwykle się wzoruje, jego pluchy, pogody często naśladuje."],"6-2":["Święty Eugenii pogodę w czerwcu odmieni."],"6-3":["Czerwiec po deszczowym maju, często dżdżysty w naszym kraju."],"6-4":["Czerwiec gdy zagrzmi, gdzie zorze zachodzą, ryby się obficie urodzą."],"6-5":["Jak w czerwcu pogoda służy, rolnik tylko oczy mruży."],"6-6":["Siej na świętego Norberta, będzie jęczmienia sterta. Norbert cztery niedziele po sobie ściele."],"6-7":["W czerwcu pełnia sprowadza burze, ostatnia kwadra zaś deszcze duże."],"6-8":["Czasem i na Świętego Medarda wiosna jeszcze przytwarda.","Jaki Medard dzień obwieści, takich będzie dni czterdzieści.","Jak się na Medarda pogoda zepsuje, to potem dni czterdzieści niebo posikuje."],"6-9":["W czerwcu się pokaże, co nam Bóg da w darze."],"6-10":["Ze świętą Małgorzatą zaczyna się lato."],"6-11":["Gdy czerwiec chłodem i wodą szafuje, to zwykle rok cały popsuje."],"6-12":["Czerwiec nosi dni gorące, kosa dzwoni już na łące."],"6-13":["Na święty Antoni pierwsza się jagódka zapłoni.","Kto sieje tatarkę na Antka i Wita, to mu pięknie powschodzi i zakwita.","Święty Antoni o gryce siać przypomni."],"6-14":["Nie trzeba w czerwcu o deszcz prosić, przyjdzie jak zaczniemy kosić."],"6-15":["Na świętego Wita zboże zakwita.","Na świętego Wita ze śpiewem ptaków kwita.","Gdy przychodzi Witus suchy, tedy wiedzie z sobą muchy."],"6-16":["Grzmoty czerwca rozweselają rolnikom serca."],"6-17":["Upał w sianokosy, żniwa - zima ostra i dokuczliwa, a jeżeli słota - w zimie dużo błota."],"6-18":["Na początku lata ranne grzmoty są zapowiedzią rychłej słoty."],"6-19":["Na świętego Gerwazego jest w ogrodzie coś pięknego.","Na święty Protazy każdy się poparzy."],"6-20":["Jak w czerwcu pogoda służy, rolnik tylko oczy mruży."],"6-21":["Dzień świętego Alojzego przyczynia wina dobrego.","Na Święty Jan przyniósł jagód dzban."],"6-22":["Gdy słońce w Raka z grzmotem wschodzi, to posuchę zwykle przynosi."],"6-23":["W dniu Wandy gdy słonko bezchmurnie zachodzi, święty Jan pogodą rolników nagrodzi.","Wanda z Janem wianki puszczają po wodzie i wspólnie radzą o żniwnej pogodzie."],"6-24":["Gdy Jan z deszczem przybywa, to słota bywa także i we żniwa.","Jak święty Jan się obwieści, takich będzie dni czterdzieści.","Chrzest Jana w deszczowej wodzie trzyma zbiory w przeszkodzie."],"6-25":["Czerwiec mokry po zimnym maju, chłopom w jesieni będzie jak w raju."],"6-26":["Czerwiec się czerwieni - będzie dość w kieszeni."],"6-27":["Czerwiec grudniową pogodę głosi, lipiec dla stycznia wróżbę przynosi."],"6-28":["Czerwiec na maju zwykle się wzoruje, jego pluchy, pogody często naśladuje."],"6-29":["Gdy Piotr z Pawłem w deszcz uderzy, słońce za mgłą tydzień leży.","Gdy święty Piotr z Pawłem płaczą, ludzie przez tydzień słońca nie zobaczą.","Kiedy święty Piotr grzeje, za wiosną jeszcze trzykroć kur zapieje."],"6-30":["Od czerwca dużo zależy, czy żniwa będą jak należy."],"7-1":["Deszcze na lipca pierwszego, drugiego, zapowiedzią deszczu czterdziestodniowego."],"7-2":["Gdy pająk w lipcu przychodzi, to za sobą deszcz przywodzi, gdy swą pajęczynę snuje, bliską burzę czuje."],"7-3":["Gdy w lipcu słońce dopieka, burza niedaleka."],"7-4":["Gdy się grzmot w lipcu od południa poda, drzewom się znaczy szwank i nieuroda."],"7-5":["Jeśli upały w sianokosy i żniwa, to zima ostra i dokuczliwa, a jeżeli słota, to w zimie dużo błota."],"7-6":["Kto w lipcu patrzy chłodu, nacierpi się w zimie głodu."],"7-7":["Kwiat lipcowy, napój zdrowy."],"7-8":["Kiedy lipiec daje deszcze, długie lato będzie jeszcze."],"7-9":["Lipcowe deszcze dla chłopa kleszcze; jak pogoda, większa swoboda."],"7-10":["Filip przepowiada, ile tygodni popada."],"7-11":["Lipcowe upały, wrzesień doskonały."],"7-12":["Lipiec – ostatek chleba wypiec."],"7-13":["W lipcu się kłosek korzy, że niesie dar boży, a najpierwsza Małgorzata, sierp w zboże założy.","Na świętą Małgorzatę kopa zawsze w polu stanie.","Ze świętą Małgorzatą upał przybiera, kanikułę otwiera."],"7-14":["Upały lipcowe wróżą mrozy styczniowe."],"7-15":["W lipcu pszczeli rój, nie opłaci trudu znój.","Święty Bonawentura pszeniczkę na polu maluje"],"7-16":["W lipcu, gdy służą pogody, bój się wielkiej wody.","Wraz ze Szkaplerną Matką, na zagon z czeladką."],"7-17":["W lipcu upały, styczeń mroźny cały."],"7-18":["Jeżeli w żniwa mysz w polu gniazdo wysoko zakłada, znak to, że zima srogie śniegi zapowiada."],"7-19":["Czego lipiec nie dowarzy, tego sierpień nie dosmaży."],"7-20":["Jaka Małgorzatka, takie będzie pół latka.","Deszcz na świętą Małgorzatę jest orzechom na stratę.","Na świętego Eliasza z nowego użątku kasza."],"7-21":["Jeśli w czasie deszczu tworzą się bańki na wodzie, słota potrwa długo."],"7-22":["Gdy Magdalena deszczem zaczyna, to zwykle deszcz dłużej trzyma.","Gdy na Świętą Marię Magdalenę jest pogoda, to obrodzi późne zboże.","Gdy na Świętą Marię Magdalenę są burze, to będzie dużo zboża w stodole."],"7-23":["Gdy listki ziemniaków w górę spoglądają, to nam na pogodę znak pewny dają."],"7-24":["Jak poranek mglisty, wieczór przezroczysty."],"7-25":["Im na Krzysztofa większe pogody, tym zimą sroższe nastaną lody.","W dzień świętego Jakuba chmury, będą śniegu fury.","Jaki Jakub do południa, taka zima też do grudnia."],"7-26":["Od świętej Anki chłodne wieczory i poranki","Gdy w świętą Annę deszcz pada, to robak orzechy zjada.","Na świętą Annę mrowiska, szukaj w zimie ogniska."],"7-27":["Kiedy się za wozem kurzy, spodziewaj się burzy."],"7-28":["Słońce mocno przypieka, burza niedaleka."],"7-29":["Około dnia świętej Marty, ze żniwami już nie żarty."],"7-30":["Jak po lipcu gorącym sierpień się ochłodzi, to później zima z wielkim śniegiem chodzi."],"7-31":["Jeśli upały w sianokosy i żniwa, to zima ostra i dokuczliwa, a jeżeli słota, to w zimie dużo błota."],"8-1":["Jaki pierwszy, drugi, trzeci, taki cały sierpień leci.","Na Świętego Piotra Polikopy grom popali kopy."],"8-2":["Jaki pierwszy, drugi ćmi, takie sierpnia, września dni."],"8-3":["Jaki pierwszy, drugi, trzeci, taki cały sierpień leci.","Jak na Piotra posuszy, lato jesień przesuszy.","Pogoda na Nikodema - cały miesiąc deszczu nie ma."],"8-4":["Na Alberta sianokosów pełna sterta."],"8-5":["Początki sierpnia pogodne, wróżą zimy łagodne."],"8-6":["W Przemienienie Pańskie są burze szatańskie."],"8-7":["Święty Kajetanie, strzeż od deszczu sprzątanie."],"8-8":["Jeśli w sierpniu dni jasne, będą stodoły ciasne."],"8-9":["Kiedy sierpień przychodzi, reszta zboża z pola schodzi."],"8-10":["Gdy Wawrzyniec i Bartłomiej (24 sie.) pogodą dopisują, piękną jesień obiecują","Gdy na Wawrzyńca orzechy obrodzą, to w zimie mrozy dogodzą"],"8-11":["Od świętej Klary są już ładne dary."],"8-12":["Kiedy sierpień przychodzi, reszta zboża z pola schodzi."],"8-13":["Gdy w dni sierpnia spieka wszędzie, tedy długa zima będzie."],"8-14":["Jak po lipcu sierpień się ochłodzi, to później zima twarda z wielkim śniegiem chodzi."],"8-15":["Gdy na Wniebowzięcie Panny ciepło dopisuje, to ciepły i pogodny koniec lata obiecuje.","Na Wniebowzięcie słota, w jesieni dużo błota."],"8-16":["Na Święty Roch w stodole groch.","Na święty Roch, jaki dzień, taka noc.","Od świętego Rocha na pole już socha."],"8-17":["Jacek gdy suchy, rozprasza jesienne pluchy.","Jeśli w dniu Jacka nie pada, suchą jesień zapowiada."],"8-18":["W sierpniu grzmotów wiele, mokrą zimę ściele."],"8-19":["Kiedy sierpień wrzos rozwija, jesień krótka, szybko mija."],"8-20":["Jeśli na Bernarda ziemia twarda, to będzie zima harda, a jak miękka to lekka."],"8-21":["Gdy w sierpniu z północy dmucha, nastaje zwykle posucha."],"8-22":["Kto w lecie nie zbiera, w zimie głodem przymiera."],"8-23":["Gdy słońce z grzmotem w znak Panny wchodzi, zapowiedź to niepogody długiej i powodzi.","Gdy księżyc w Pannie o grzmoty, pięćdziesiąt dni pluszczą słoty."],"8-24":["Święty Bartłomiej zwiastuje, jaka jesień następuje.","Jaki dzień Bartłomieja, takiej jesieni nadzieja","Kiedy do Bartłomieja bocian u nas trwa mnogi, tedy zima lekka będzie i opał niedrogi."],"8-25":["Na Ludwika zboże z pola umyka.","Gdy na Luizy ładnie, śnieg późno spadnie."],"8-26":["Jeżeli w sierpniu gorąco będzie, to zima w śniegi długo zasiędzie."],"8-27":["Dużo grzybów sierpniowych, dużo zawiei śniegowych."],"8-28":["Sierpień pogodny jest dla winogron wygodny."],"8-29":["Gdy sierpień w upały zbywa lato długie zwykle bywa."],"8-30":["Czego sierpień nie dowarzy, tego wrzesień nie doparzy."],"8-31":["Ostatni sierpnia zapowiada, jaka pogoda na wrzesień wypada."],"9-1":["Pierwszy września pogodny, w zimie czas wygodny.","Gdy na święty Idzi ładnie, śnieg na pewno późno spadnie.","Gdy święty Idzi burzliwie się poda, przez cały wrzesień niestała pogoda."],"9-2":["Jeśli wrzesień z pogodą zaczyna, zwykle przez miesiąc pogoda trzyma."],"9-3":["Wrzeszczy wrzesień, że już jesień."],"9-4":["Gdy nadejdzie wrzesień, rolnik ma zawsze pełną kieszeń."],"9-5":["Gdy wrzesień bez deszczów będzie, w zimie wiatrów pełno wszędzie."],"9-6":["Jak we wrześniu krety kopią po nizinach, będzie wietrzno, ale lekka zima."],"9-7":["Święta Regina mgły rozpina.","W dzień świętej Reginy wabią chłopaków dziewczyny.","Święta Regina gałęzie ugina."],"9-8":["Gdy Narodzenie Maryi pogodne, to będzie tak cztery tygodnie.","Jeśli w Maryi Narodzenie nie pada, to sucha jesień się zapowiada.","Gdy na Siewną jest błękitnie, wtedy pięknie wrzos zakwitnie."],"9-9":["Gdy grzyby wielkie korzenie mają, wielką zimę zapowiadają."],"9-10":["Na świętego Łukasza jest w domu chleb i kasza."],"9-11":["Gdy na Jacka pogodnie, suche w jesieni dnie.","Jeśli na Jacka nie panuje plucha, to pewnie zima będzie sucha.","Ze wszystkich świętych najlepszy Jacek, bo kto żyje dostał placek."],"9-12":["Jeśli wrzesień będzie ciepły i suchy, pewno październik nie oszczędzi pluchy."],"9-13":["Czym dłużej jaskółki we wrześniu zostają, tym dłużej piękne i jasne dni bywają."],"9-14":["Na Podwyższenie Świętego Krzyża jesień się przybliża."],"9-15":["Jakie Najświętszej Maryi Panny urodziny (8 wrz.), takie też i imieniny (15 wrz.).","Nikodem gdy suchy, rozprasza jesienne pluchy.","Pogoda na Nikodema - niedziel cztery deszczu nie ma."],"9-16":["Im głębiej we wrześniu grzebią się robaki, tym srożej się zima da ludziom we znaki."],"9-17":["Jaką pogodę na nowiu da wrzesień, taka bywa zwykle przez całą jesień."],"9-18":["Kiedy Irena z mrozem przybywa, babie lato krótkie bywa."],"9-19":["Na świętego Teodora zapełniona komora."],"9-20":["Gdy we wrześniu grzybów brak, niezawodny zimy znak."],"9-21":["Gdy na święty Mateusz śnieg przybieżał, będzie po pas całą zimę leżał.","Mateusz bez dżdżów potoku da win do przyszłego roku.","Na święty Mateusz jeśli mróz, jeszcze sanie do szopy włóż."],"9-22":["Joachima boską mocą dzionek już się równa z nocą.","Jeśli jasny Maurycy, to rad w zimie wiatr ryczy.","Jeśli Maurycy ma jasne lice, to przyprowadzi wnet nawałnicę."],"9-23":["Skoro wrzesień, to już jesień, ale jabłek pełna kieszeń."],"9-24":["Gerard czasem wróży na to, że z nim przyjdzie drugie lato.","Na Gerarda, gdy sucho, zima będzie z pluchą."],"9-25":["Gdy Kleofas we mgle chodzi, mokrą zimę zwykle zrodzi."],"9-26":["We wrześniu, gdy tłuste ptaki, srogo się zima da ludziom we znaki."],"9-27":["Straszna jest wrześniowa słota - miarka deszczu, korzec błota."],"9-28":["Na świętego Wacława w polu pustki, w domu sława.","Gdy na Wacława i Michała (29 wrz.) jasno, nie będzie w zimie ciasno."],"9-29":["Do Michała przymrozków ile i w maju tyle.","Gdy deszcz w świętego Michała, będzie łagodna zima cała.","Gdy na Michała obrodzą żołędzie, dużo śniegów w zimie będzie."],"9-30":["Na świętego Hieronima jest pogoda albo jej ni ma.","Wiele ostu we wrzesień wróży pogodną jesień."],"10-1":["Gdy październik mroźny, to nie będzie styczeń groźny."],"10-2":["Gdy w październiku ciepło chadza, w lutym mrozy naprowadza."],"10-3":["Na Gerarda gdy sucho lato będzie z pluchą."],"10-4":["Na Święty Franciszku, czego się chłopie po polu kręcisz?","Po Świętym Franciszku pasą bydło na żytnisku.","Na świętego Franciszka odlatuje pliszka"],"10-5":["W październiku, gdy liść z drzewa niesporo opada, późną to wiosnę zapowiada."],"10-6":["W październiku kawek gromada, słotne dni nam zapowiada."],"10-7":["Kiedy październik śnieżny i chłodny, to styczeń zwykle łagodny."],"10-8":["Po świętej Brygidzie babie lato przyjdzie."],"10-9":["Gdy październik z wodami, grudzień z wiatrami."],"10-10":["Październik chodzi po kraju, cichnie ptactwo w gaju."],"10-11":["Październik spoczynku nie chce dać, każe orać, każe siać."],"10-12":["Gdy październik ostro trzyma, zwykle potem ostra zima."],"10-13":["W Edwarda jesień twarda."],"10-14":["Gdy październik ciepło trzyma, zwykle mroźna bywa zima."],"10-15":["Koło świętej Jadwigi babie lato fruwa na wyścigi","Od świętej Jadwigi z pola na wyścigi","Na świętą Jadwigę, jeśli deszcz nie pada, to do kapusty Bóg miodu dokłada"],"10-16":["Kiedy w święty Gaweł słota, będzie w lecie dużo błota."],"10-17":["Gdy październik mokro trzyma, zwykle potem ostra zima."],"10-18":["Październik chodzi po kraju, wygania ptactwo z gaju.","Na Świętego Łuka schowaj pług i włóka."],"10-19":["Październik ciepły, będzie luty skrzepły."],"10-20":["Idzie jesień, a tu pusta kieszeń."],"10-21":["Od świętej Urszuli chłop się kożuchem otuli.","Od świętej Urszuli oczekuj śnieżnej koszuli.","Święta Urszula – perły rozsuła, miesiąc wiedział – nie powiedział, słońce wstało, pozbierało."],"10-22":["Ile razy przed nowiem w październiku śnieg spadnie, tyle razy wśród zimy odwilży przypadnie."],"10-23":["Kiedy październik śnieżny i chłodny, to styczeń bywa zwykle pogodny."],"10-24":["W jesieni prędko gdy liść z drzewa spadnie, to wkrótce zima będzie, każdy zgadnie."],"10-25":["Jaki październik, taki marzec, doznał tego niejeden starzec."],"10-26":["Gdy jesień zamglona, zima zaśnieżona."],"10-27":["Kiedy październik śnieżny i chłodny, to styczeń zwykle łagodny."],"10-28":["Jak przyjdzie Szymon i Judy, zagoń bydło z pola do budy.","Po świętym Tadeuszu trzeba chodzić w kapeluszu.","Na Świętego Szymona i Judy spodziewaj się śniegu albo grudy."],"10-29":["Gdy październik mroźny, to nie będzie styczeń groźny."],"10-30":["Gdy w październiku ciepło chadza, w lutym mrozy naprowadza."],"10-31":["Październik stoi u dwora, wykop ziemniaki pora."],"11-1":["We Wszystkich Świętych, gdy się deszcz rozpada, może słota potrzymać do końca listopada.","Czasy niekiedy bywają, że Wszyscy Święci w bieli przybywają.","Na Wszystkich Świętych ziemia skrzepła, to będzie zima ciepła, a jak deszcz, to trzeba będzie za piec wleść."],"11-2":["Dzień Zaduszny bywa pluśny, niebo płacze, ludzie płaczą, a ubogich chlebem raczą, rozdając jałmużnę za duszyczki różne.","Jak listopad ciepły - marzec mrozem przewlekły. Gdy listopad mroźny, to lipiec nie groźny."],"11-3":["Kiedy swego czasu goły las nastaje, święty Hubert z lasu cały obiad daje.","Jaki listopad trzeci, taki marzec się kleci.","Deszcz z początkiem listopada, mrozy w styczniu zapowiada."],"11-4":["Deszcze listopadowe budzą wiatry zimowe.","Gdy w listopadzie gawrony gromadnie latają, deszcze albo śniegi zapowiadają.","Na świętego Franciszka chłop w polu nic nie zyska."],"11-5":["Gdy w listopadzie liść na szczytach drzew się trzyma, to w maju na nowe liście spadnie jeszcze zima.","Pogoda listopadowa taka jak Tytusowa (4 kwi.)."],"11-6":["Jaki listopad, taki będzie marzec, prorokuje stuletni starzec."],"11-7":["Jaka pogoda listopadowa, taka i marcowa.","Kiedy zima w listopadzie, jeszcze w kwietniu zimno się kładzie."],"11-8":["Gdy łagodna jesień trzyma, będzie krótka, ostra zima."],"11-9":["Kiedy zima w listopadzie, jeszcze w kwietniu zimno się kładzie.","W listopadzie goło w sadzie.","Listopad marcowi za rodzica służy i marcowe psoty wróży."],"11-10":["Gdy w listopadzie wody się podniosą, to snadź w zimie deszcze roszą."],"11-11":["Marcinowa gęś po wodzie, Boże Narodzenie na lodzie; Marcinowa gęś po lodzie, Boże Narodzenie po wodzie.","Gdy święty Marcin po lodzie, to kolęda po wodzie.","Gdy liście przed Marcinem nie opadają, to mroźną zimę przepowiadają."],"11-12":["Jaka pogoda w listopadzie służy, taka na marzec się wróży.","Witold w listopadzie grzmi, rolnik wiosną śni."],"11-13":["Na Stanisława Kostkę ujrzysz śniegu drobnostkę, a na Ofiarowanie (21.11) przydadzą się sanie."],"11-14":["Jeśli kret w listopadzie jeszcze późno ryje, na Nowy Rok komar wpadnie w bryję.","Listopad marcowi za rodzica służy i marcowe psoty wróży."],"11-15":["Listopad ciecze, marzec nie podpiecze.","Deszcz w połowie listopada, tęgi mróz w połowie stycznia zapowiada."],"11-16":["Deszcz w połowie listopada, tęgi mróz w styczniu zapowiada.","Deszcz w Marka, Ziemia w lecie jak skwarka."],"11-17":["W połowie listopada deszczy, w połowie stycznia trzeszczy.","Od świętej Salomei zima jest w nadziei."],"11-18":["Gdy listopad z deszczami, grudzień zwykle z wiatrami."],"11-19":["Na świętą Elżbietę bywa śnieg nad piętę.","Święta Elżbieta - śniegiem pokryta.","Zjawia to Elżbieta święta, czy ta zima będzie cięta."],"11-20":["W listopadzie mróz, szykuj w marcu wóz."],"11-21":["Dwudziesty pierwszy listopada pogodę zimy zapowiada.","Gdy pogoda w Ofiarowanie, ostra zima nastanie.","Jaka pogoda w Ofiarowanie służy, taka się na całą zimę wróży."],"11-22":["Gdy na świętą Cecylię grzmi, rolnikom o dobry roku śni.","Święto Cecylii jesień nam umili."],"11-23":["Święta Elżbieta - śniegiem pokryta."],"11-24":["Deszcz w połowie listopada, tęgi mróz w połowie stycznia zapowiada."],"11-25":["Jak się Katarzyna głosi, tak się Nowy Rok nosi.","Katarzyna dzień jaki, cały grudzień taki.","Kiedy w świętą Katarzynę lód nie stanie, to gotuj sanie."],"11-26":["W jesieni zając kożuch na chropawy w niedługim czasie nos twój jest sinawy."],"11-27":["Gdy zbyt długo złota jesień trzyma nagle przyjdzie zima."],"11-28":["Kiedy Zdzisiek rano szroni zima jest w zasięgu dłoni."],"11-29":["Słońce listopada mrozy zapowiada."],"11-30":["Gdy święty Andrzej ze śniegiem przybieży sto dni śnieg w polu leży.","Na świętego Andrzeja trza kożucha dobrodzieja.","Gdy w Andrzeja deszcz lub słota, w grudniu drogi bez błota."],"12-1":["Jedna jaskółka wiosny nie czyni."],"12-2":["Gdy na początku grudnia pogoda stała, zima będzie długo biała."],"12-3":["Im więcej w grudniu pogody, tym więcej wiosną wody."],"12-4":["Barbara po wodzie, Boże Narodzenie po lodzie.","Gdy w świętą Barbarę gęś po stawie chodzi, w Boże Narodzenie pływać po nim się godzi","Kiedy na Świętą Barbarę błoto, będzie zima jak złoto."],"12-5":["Piąty grudzień stycznia czyni znaki, szósty grudzień luty przepowiada, siódmy grudzień o marcu gada."],"12-6":["Jeśli święty Mikołaj lodu nie roztopi, długo będą w ręce chuchać chłopi","W Mikołaja, gdy deszcz wszędzie, cała zima lekka będzie."],"12-7":["Na święty Ambroży poprawią się mrozy."],"12-8":["Jeśli w grudniu często dmucha, to w marcu i kwietniu plucha."],"12-9":["Grudzień to miesiąc zawiły, czasem srogi, czasem miły."],"12-10":["Pogoda grudniowa – wody połowa, lodu połowa."],"12-11":["Suchy grudzień stoi za to, że sucha będzie wiosna i suche lato."],"12-12":["Grudzień zimny, śniegiem pokryty, daje rok w zboże obfity."],"12-13":["Gdy w świętą Łucję mróz, styczeń nie napruszy dużo śniegu.","Święta Łucja głosi, jaką pogodę styczeń przynosi.","Od Łucji do Wigilii patrz dni - o przyszłym roku powiedzą Ci."],"12-14":["Taką pogodę Nowy Rok przynosi, jaka na Jana od Krzyża się głosi."],"12-15":["Po suchym grudniu sucha wiosna bywa i pogoda we żniwa."],"12-16":["Grudzień zimny, śniegiem przykryty, daje rok w zboże obfity."],"12-17":["Mroźny grudzień, wiele śniegu, żyzny roczek będzie w biegu."],"12-18":["Jeśli w grudniu często dmucha, to w marcu wciąż plucha."],"12-19":["Gdy w adwencie szadź na drzewach się pokazuje, to rok urodzajny nam zwiastuje."],"12-20":["Gdy ciepło na Dominika, ostra zima nas dotyka.","Gdy Makary pogodny, cały styczeń chłodny.","Dzień świętego Makarego pewnie przepowiada, czy we wrześniu pogoda, czy też ciągle pada."],"12-21":["Na Święty Toma Gody już doma.","Gdy na Tomasza deszcz pada, zmienną zimę zapowiada.","Na święty Tomasz dzień się z nocą sili, mniej nocy, więcej dnia będzie po chwili."],"12-22":["Gdy woda zimą huczy, to na wiosnę mróz dokuczy."],"12-23":["Grudzień ze śniegiem zimny, żytom na wskroś przyjemny."],"12-24":["Adam i Ewa pokazują, jaki styczeń i luty po nich następują","Słota w dzień Adama i Ewy, zabezpiecz od zimna cholewy.","Gdy w dzień Adama i Ewy mróz i pięknie, zima wcześnie pęknie."],"12-25":["Boże Narodzenie po lodzie, Wielkanoc po wodzie.","Boże Narodzenie po wodzie, Wielkanoc po lodzie.","Gdy w Boże Narodzenie pola są zielone, na Wielkanoc będą śniegiem przywalone."],"12-26":["Na Świętego Szczepana, bywa błoto po kolana.","Szczepan mroźny, luty groźny.","Jaka pogoda w Szczepana panuje, taka na luty nam się szykuje."],"12-27":["Pogoda marcowa, taka sama jak i Szczepanowa.","Wigilia jasna, święty Jan ciemny, obiecują rok przyjemny."],"12-28":["Niewiniątek dzień pokaże, jaka pogoda w marcu się okaże."],"12-29":["Święty Józef pogodny, będzie roczek urodny"],"12-30":["Jeśli da śnieg Eugenii, to się zima przemieni.","Eugeniego lód albo woda pokaże, czy w maju będzie pogoda."],"12-31":["Dzień Sylwestrowy pokaże czas lipcowy."]};

  { date:'2026-06-26', phase:'Pełnia', symbol:'🌕' },
  { date:'2026-07-04', phase:'Ostatnia kwadra', symbol:'🌗' },
];

function getMoonPhase(date) {
  const known = new Date('2000-01-06T18:14:00Z');
  const diff = (date - known) / 86400000;
  const cycle = 29.53059;
  const age = ((diff % cycle) + cycle) % cycle;
  if (age < 1.5) return { phase:'Nów', symbol:'🌑', age:Math.round(age) };
  if (age < 7.38) return { phase:'Przybywający sierp', symbol:'🌒', age:Math.round(age) };
  if (age < 8.88) return { phase:'Pierwsza kwadra', symbol:'🌓', age:Math.round(age) };
  if (age < 14.77) return { phase:'Przybywający garb', symbol:'🌔', age:Math.round(age) };
  if (age < 16.27) return { phase:'Pełnia', symbol:'🌕', age:Math.round(age) };
  if (age < 22.15) return { phase:'Ubywający garb', symbol:'🌖', age:Math.round(age) };
  if (age < 23.65) return { phase:'Ostatnia kwadra', symbol:'🌗', age:Math.round(age) };
  return { phase:'Ubywający sierp', symbol:'🌘', age:Math.round(age) };
}

function getSunTimes(date) {
  const lat = 52.23, lon = 21.01;
  const JD = date.getTime() / 86400000 + 2440587.5;
  const n = JD - 2451545.0;
  const L = (280.46 + 0.9856474 * n) % 360;
  const g = (357.528 + 0.9856003 * n) % 360 * Math.PI / 180;
  const lambda = ((L + 1.915 * Math.sin(g) + 0.02 * Math.sin(2*g)) * Math.PI / 180);
  const eps = (23.439 - 0.0000004 * n) * Math.PI / 180;
  const sinDec = Math.sin(eps) * Math.sin(lambda);
  const dec = Math.asin(sinDec);
  const cosDec = Math.cos(dec);
  const cosLat = Math.cos(lat * Math.PI / 180);
  const sinLat = Math.sin(lat * Math.PI / 180);
  const cosH = (Math.cos(90.833 * Math.PI / 180) - sinLat * sinDec) / (cosLat * cosDec);
  if (cosH > 1 || cosH < -1) return null;
  const H = Math.acos(cosH) * 180 / Math.PI;
  const eot = (-7.655 * Math.sin(g) + 9.873 * Math.sin(2*lambda + 3.588) + 0.439 * Math.sin(4*lambda)) / 60;
  const noon = 12 - lon/15 - eot;
  const offset = isPolandDST(date.getFullYear(), date.getMonth() + 1, date.getDate()) ? 2 : 1;
  return { rise: noon - H/15 + offset, set: noon + H/15 + offset };
}

// Czas letni UE liczony wprost z daty docelowej (nie z przyblizonych stalych dni 29/25) — patrz index.html
function isPolandDST(year,month,day){
  if(month<3||month>10)return false;
  if(month>3&&month<10)return true;
  const lastSunday=(y,m)=>{const d=new Date(Date.UTC(y,m,0));const dow=d.getUTCDay();d.setUTCDate(d.getUTCDate()-dow);return d.getUTCDate();};
  if(month===3)return day>=lastSunday(year,3);
  return day<lastSunday(year,10);
}

function fmtTime(h) {
  let hh = Math.floor(h) % 24;
  let mm = Math.round((h - Math.floor(h)) * 60);
  if (mm === 60) { mm = 0; hh = (hh + 1) % 24; }
  return String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0');
}

function dayOfYear(d) {
  return Math.round((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
}

function weekOfYear(d) {
  const startOfYear = new Date(d.getFullYear(), 0, 1);
  return Math.ceil(((d - startOfYear) / 86400000 + startOfYear.getDay() + 1) / 7);
}

function renderDay(dateStr) {
  const date = new Date(dateStr + 'T12:00:00');
  const d = date.getDate(), m = date.getMonth() + 1, y = date.getFullYear();
  const wd = WEEKDAYS[date.getDay()];
  const doy = dayOfYear(date);
  const woy = weekOfYear(date);
  const daysLeft = (new Date(y, 11, 31) - date) / 86400000;
  const key = m + '-' + d;

  // Hero
  document.getElementById('heroDate').innerHTML = `
    <div>
      <div class="hero-day">${d}</div>
      <div class="hero-month">${MONTHS_GEN[m-1]} ${y}</div>
      <div class="hero-weekday">${wd.charAt(0).toUpperCase() + wd.slice(1)}</div>
    </div>
    <div class="hero-meta">
      <div class="meta-item">Dzień roku<br><span class="meta-val">${doy}</span></div>
      <div class="meta-item">Tydzień<br><span class="meta-val">${woy}</span></div>
      <div class="meta-item">Dni do końca roku<br><span class="meta-val">${Math.round(daysLeft)}</span></div>
    </div>
  `;

  // Imieniny
  const names = NAMES_DB[key] || NAMES_DB[m + '-' + d] || [];
  const namesHTML = names.length
    ? names.map(n => `<a href="${nameHref(n)}" class="name-badge">${n}</a>`).join('')
    : '<span style="color:var(--muted);font-size:.82rem">Brak danych dla tego dnia</span>';

  // Słońce
  const sun = getSunTimes(date);
  const sunHTML = sun
    ? `<div class="sun-row">
        <div class="sun-item"><div class="sun-time">☀️ ${fmtTime(sun.rise)}</div><div class="sun-lbl">Wschód słońca</div></div>
        <div class="sun-item"><div class="sun-time">🌅 ${fmtTime(sun.set)}</div><div class="sun-lbl">Zachód słońca</div></div>
        <div class="sun-item"><div class="sun-time">⏱ ${Math.floor(sun.set-sun.rise)}h ${Math.round(((sun.set-sun.rise)%1)*60)}m</div><div class="sun-lbl">Długość dnia</div></div>
      </div>` : 'Brak danych';

  // Księżyc
  const moon = getMoonPhase(date);
  const moonHTML = `<div class="moon-row"><div class="moon-symbol">${moon.symbol}</div><div class="moon-info"><div class="moon-phase">${moon.phase}</div><div class="moon-age">${moon.age}. dzień cyklu</div></div></div>`;

  // Święta
  const hols = HOLIDAYS_DB[key] || [];
  const holsHTML = hols.length
    ? `<div class="holiday-list">${hols.map(h => `<div class="holiday-item"><div class="holiday-icon">🎉</div><div>${h}</div></div>`).join('')}</div>`
    : '<span style="color:var(--muted);font-size:.82rem">Brak świąt tego dnia</span>';

  document.getElementById('infoGrid').innerHTML = `
    <div class="info-card">
      <div class="ic-label">🎂 Imieniny</div>
      <div class="names-row">${namesHTML}</div>
    </div>
    <div class="info-card">
      <div class="ic-label">☀️ Słońce — Warszawa</div>
      ${sunHTML}
    </div>
    <div class="info-card">
      <div class="ic-label">🌙 Faza Księżyca</div>
      ${moonHTML}
    </div>
    <div class="info-card">
      <div class="ic-label">🎊 Święta i wydarzenia</div>
      ${holsHTML}
    </div>
  `;

  // Przysłowie
  const provs = PROVERBS_DB[key] || [];
  if (provs.length) {
    document.getElementById('proverbCard').innerHTML = `
      <div class="proverb-card">
        <div class="proverb-label">🌾 Przysłowie na dziś</div>
        <div class="proverb-text">${provs[0]}</div>
        ${provs[1] ? `<div class="proverb-text" style="margin-top:.75rem;font-size:.95rem;color:var(--muted)">${provs[1]}</div>` : ''}
      </div>
    `;
  } else {
    document.getElementById('proverbCard').innerHTML = '';
  }

  // Update nav buttons
  const prev = new Date(date); prev.setDate(prev.getDate() - 1);
  const next = new Date(date); next.setDate(next.getDate() + 1);
  document.getElementById('prevBtn').onclick = () => navigate(prev.toISOString().slice(0,10));
  document.getElementById('nextBtn').onclick = () => navigate(next.toISOString().slice(0,10));
}

function navigate(dateStr) {
  document.getElementById('datePicker').value = dateStr;
  renderDay(dateStr);
}

function goToday() {
  const today = new Date().toISOString().slice(0,10);
  navigate(today);
}

document.getElementById('datePicker').addEventListener('change', function() {
  renderDay(this.value);
});

// Sprawdź URL param
const urlDate = new URLSearchParams(window.location.search).get('date');
if (urlDate) {
  document.getElementById('datePicker').value = urlDate;
  renderDay(urlDate);
} else {
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('datePicker').value = today;
  renderDay(today);
}
</script>

<script>
  function toggleDarkMode(){
    var d=document.documentElement;
    var t=d.getAttribute('data-theme')==='dark'?'light':'dark';
    d.setAttribute('data-theme',t);
    localStorage.setItem('dbd-theme',t);
    updateThemeBtn();
  }
  function updateThemeBtn(){
    var b=document.getElementById('themeToggle');
    if(b) b.setAttribute('aria-label', document.documentElement.getAttribute('data-theme')==='dark'?'Przełącz na tryb jasny':'Przełącz na tryb ciemny');
    if(b) b.textContent=document.documentElement.getAttribute('data-theme')==='dark'?'☀':'☾';
  }
  function cycleFontSize(){
    var sizes=['normal','large','xl'];
    var d=document.documentElement;
    var cur=d.getAttribute('data-font')||'normal';
    var next=sizes[(sizes.indexOf(cur)+1)%sizes.length];
    d.setAttribute('data-font',next);
    localStorage.setItem('dbd-font',next);
    updateFontBtn();
  }
  function updateFontBtn(){
    var b=document.getElementById('fontToggle');
    if(!b) return;
    var f=document.documentElement.getAttribute('data-font')||'normal';
    b.textContent=f==='normal'?'A':f==='large'?'A+':'A++';
    b.setAttribute('aria-label',f==='normal'?'Zwiększ czcionkę':f==='large'?'Jeszcze większa czcionka':'Przywróć domyślną czcionkę');
  }
  (function(){
    updateThemeBtn();
    updateFontBtn();
  })();
</script>
