ień świętego Kazimierza zima do morza zmierza.","Na Świętego Kazimierza wyjdzie skowronek spod perza.","Na świętego Kazimierza pełno już młodego zwierza."],"3-5":["Co marzec wypiecze, to kwiecień wysiecze.","Czasami w marcu zetnie wodę w garncu."],"3-6":["Kiedy w marcu deszczu wiele, nieurodzaj zboża ściele.","W marcu, gdy są grzmoty, urośnie zboże ponad płoty."],"3-7":["W marcu, gdy grzmot na lody spada, w lecie grad zapowiada.","Czasem marzec tak się podsadzi, że dwa kożuchy oblec nie zawadzi."],"3-8":["Marzec - figlarzec, przeplata, trochę zimy, trochę lata.","Ile w marcu dni mglistych, tyle w żniwa dni dżdżystych."],"3-9":["Co marzec wypiecze, to kwiecień wysiecze.","Gdy Franciszka z wichrem po polu hasa, może sypnąć śniegiem powyżej pasa."],"3-10":["Gdy mróz w marcu dnia dziesiątego, jeszcze czterdzieści dni mrozu takiego.","Ile razy marzec mgłą uraczy, tyle niepogody w lecie znaczy."],"3-11":["Kiedy w marcu deszczu wiele, nieurodzaj zboża ściele.","Marzec uparty stroi z pługiem żarty."],"3-12":["Na świętego Grzegorza idzie zima do morza.","Na Św. Grzegorza idzie zima do morza.","Na świętego Grzegorza, idzie zima do morza."],"3-13":["Każdy gospodarz zasiewa pierwszy groch na marca, aby też próżnego nie miał na ognicku garnca.","W marcu, gdy są grzmoty, urośnie zboże ponad płoty."],"3-14":["Gdy w marcu deszcz pada, wtedy rolnik biada, gdy słońce jaśnieje, to rolnik się śmieje.","Gdy suchy marzec, a maj mokry bywa, żyznego roku oracz się spodziewa."],"3-15":["Marzec, co z deszczem chadza, mokry czerwiec sprowadza.","Gdy w marcu deszcz pada, wtedy rolnik biada, gdy słonko jaśnieje, to rolnik się śmieje."],"3-16":["Słońce marcowe, owocom niezdrowe.","Hilary zapowiada, jaka pogoda na Wielkanoc przypada."],"3-17":["Gdy na Gertrudy zjawią się bociany, to wiosna już rychło nastanie.","Marzec zielony - niedobre plony."],"3-18":["Suchy marzec, kwiecień mokry, maj przechłodny - nie będzie rok głodny.","Na świętego Edwarda zimy pogarda."],"3-19":["Na świętego Józefa pięknie, zima prędko pęknie.","W Józefa z zimy się śmiej i na grządce kapustę siej.","Przyjdzie święty Józef z pomocą, porówna dzień z nocą."],"3-20":["Równonoc wiosenna — dzień z nocą w parze.","Od dnia dwudziestego marca zagrzewa słońce nawet starca."],"3-21":["Suchy marzec, mokry maj, będzie żytko jako gaj.","Jedna jaskółka nie przynosi wiosny."],"3-22":["Jeżeli w pierwszy dzień po przesileniu marcowym burza się zdarzy, zima już nie przydarzy.","W marcu jak w garncu."],"3-23":["W marcu, gdy są grzmoty, urośnie zboże ponad płoty.","Marzec zimny i słoneczny, plon zaręcza dostateczny."],"3-24":["Marzec, czy słoneczny, czy płaczliwy, listopad obraz żywy.","Na Świętego Szymona nie wdziewaj już kaftana."],"3-25":["Na Zwiastowanie bocian do domu wita — wiosna jak złoto.","Na Zwiastowanie Najświętszej Panny jaskółki się pokazują i wiosnę zwiastują.","Na Zwiastowanie bocian na gnieździe stanie."],"3-26":["Marzec, czy słoneczny, czy płaczliwy, listopada obraz żywy.","Marzec odmienia wiatry, deszcz miesza z pogodą, więc nie dziw, jeśli starzy czują go ze szkodą."],"3-27":["W marcu jak w garncu.","Gdy w Ruperta niebo jasne będzie, w lipcu takiż czas pogody wszędzie."],"3-28":["Co marzec wypiecze, to kwiecień wysiecze.","Czasami w marcu zetnie wodę w garncu."],"3-29":["Ile mgieł w marcu, tyle deszczów w czerwcu.","Co marzec wypiecze, to kwiecień wysiecze."],"3-30":["Czasem marzec tak się podsadzi, że dwa kożuchy oblec nie zawadzi.","Ile w marcu dni mglistych, tyle w żniwa dni dżdżystych."],"3-31":["Nie siejesz grochu w marcu, nie masz go w garncu.","Po niestatecznym marcu świat się cieszy majem."],"4-1":["Kwiecień plecień — bo przeplata trochę zimy, trochę lata.","Kwiecień, plecień, bo przeplata, trochę zimy, trochę lata.","Kiedy w kwietniu słonko grzeje, wtedy chłop nie zubożeje."],"4-2":["Ciepły kwiecień, mokry maj, będzie żytko jako gaj.","Pogody kwietniowe - słoty majowe."],"4-3":["Przyjdzie kwiecień, ostatki z gumna wymieciem.","Deszcze częste w kwietniu wróżą, że owoców będzie dużo."],"4-4":["Na świętego Izydora – dla bocianów pora.","Suchy marzec, maj nie chłodny, kwiecień mokry, rok nie głodny."],"4-5":["Gdyby w kwietniu nie padało, to owoców będzie mało.","Kwiecień co deszczem rosi, wiele owoców przynosi."],"4-6":["Jak przygrzeje słonko, przejdzie kwiecień łąką.","Deszcze częste w kwietniu wróżą, że owoców będzie dużo."],"4-7":["Na świętego Donata idź po pracę do brata.","Choć i w kwietniu słonko grzeje, nieraz pole śnieg zawieje."],"4-8":["Kwiecień-plecień, bo przeplata, trochę zimy, trochę lata.","Jeśli w kwietniu pszczoły latają, to długie chłody się zapowiadają."],"4-9":["Kwiecień, plecień, bo przeplata, trochę zimy, trochę lata.","Deszcze częste w kwietniu wróżą, że owoców będzie dużo."],"4-10":["Kiedy w kwietniu słonko grzeje, wtedy chłop nie zubożeje.","Gdyby w kwietniu nie padało, to owoców będzie mało."],"4-11":["Kwiecień, co deszczem rosi, wiele owoców przynosi.","Kiedy w kwietniu słonko grzeje, wtedy chłop nie zubożeje."],"4-12":["Ciepły kwiecień, mokry maj, będzie żytko jako gaj.","Pogody kwietniowe - słoty majowe."],"4-13":["Kwiecień co deszczem rosi, wiele owoców przynosi.","Deszcze częste w kwietniu wróżą, że owoców będzie dużo."],"4-14":["Gdyby w kwietniu nie padało, to owoców będzie mało.","Jak przygrzeje słonko, przejdzie kwiecień łąką."],"4-15":["Kwiecień co deszczem rosi, wiele owoców przynosi.","Jak przygrzeje słonko, przejdzie kwiecień łąką."],"4-16":["Choć i w kwietniu słonko grzeje, nieraz pole śnieg zawieje.","Grzmot w kwietniu dobra nowina, już szron roślin nie pościna."],"4-17":["Jeśli w kwietniu pszczoły latają, to długie chłody się zapowiadają.","Za kwietniem ciepłym idzie maj chłodny."],"4-18":["Kwiecień, plecień, bo przeplata, trochę zimy, trochę lata.","Mokre dni kwietnia zazwyczaj wróżą, że w lecie będzie owoców dużo."],"4-19":["Ciepły kwiecień, mokry maj – będzie zboże jako gaj.","Kiedy w kwietniu słonko grzeje, wtedy chłop nie zubożeje."],"4-20":["Ciepły kwiecień, mokry maj, będzie żytko jako gaj.","Pogody kwietniowe — słoty majowe."],"4-21":["Gdy kwiecień chmurny, a maj z wiatrami, rok żyzny przed nami.","Deszcze częste w kwietniu wróżą, że owoców będzie dużo."],"4-22":["Pogody kwietniowe - słoty majowe.","Deszcze częste w kwietniu wróżą, że owoców będzie dużo."],"4-23":["Kiedy grzmi na Wojciecha, rośnie w polu pociecha.","Grzmot w świętego Wojciecha, to chłopięca uciecha.","Ile dni przed św. Wojciechem kukułka się odezwie albo żaba zaskrzeczy, tyle dni po św. Wojciechu będzie zimno."],"4-24":["Na święty Jerzy rosa, nie trzeba koniom owsa.","W kwietniu posusza, nic się na polach nie rusza."],"4-25":["Jak Marek przypieka, chłop jeszcze ponarzeka.","Gdyby w kwietniu nie padało, to owoców będzie mało."],"4-26":["W kwietniu łagodne kwiatki, w grudniu śnieżne płatki.","Kwiecień co deszczem rosi, wiele owoców przynosi."],"4-27":["Jak przygrzeje słonko, przejdzie kwiecień łąką.","Kwiecień, co deszczem rosi, wiele owoców przynosi."],"4-28":["Choć i w kwietniu słonko grzeje, nieraz pole śnieg zawieje.","Jeśli w św. Paweł śnieg albo deszcz pada, dobrych się urodzajów spodziewać wypada."],"4-29":["Jeśli w kwietniu pszczoły latają, to długie chłody się zapowiadają.","Kwiecień, plecień, bo przeplata, trochę zimy, trochę lata."],"4-30":["W kwietniu po brzegach wody niosą jęczmienia urody.","Kiedy w kwietniu słonko grzeje, wtedy chłop nie zubożeje.","Ciepły kwiecień, mokry maj, będzie żytko jako gaj."],"5-1":["Maj chłodny i deszczowy — rok urodzajny.","Chłodny maj, dobry urodzaj.","Pierwszego maja deszcz, nieurodzaju wieszcz."],"5-2":["Chłodny maj, dobry urodzaj.","W Zygmunta deszcz — nieurodzaju wieszcz."],"5-3":["Ciepły kwiecień, mokry maj - będzie zboże jako gaj.","Częste w maju grzmoty rozpraszają chłopom zgryzoty."],"5-4":["Florian ognie gasi — deszcze przywołuje.","Na Floriana deszcz pada — pożary nie grożą."],"5-5":["Deszcz majowy, chleb gotowy.","Maj bogaty sieje kwiaty."],"5-6":["Kiedy mokry maj, będzie żyto jako gaj.","Na Filipa, gdy przymrozek spadnie, najgorsza zaraza na zboże przypadnie."],"5-7":["Gizela święta zimy nie pamięta.","Kiedy mokry maj, będzie żyto jako gaj."],"5-8":["Dużo chrabąszczy w maju, proso będzie niby w gaju.","Na świętego Stanisława rośnie koniom trawa."],"5-9":["Gdy maj jest przy pogodzie, nie bywają siana w szkodzie.","Gdy rój w maju idzie w górę, kosztuje on siana furę."],"5-10":["Izydor rolnik — patron dobrych zbiorów.","Na świętego Izydora często bywa chłodna pora."],"5-11":["Grzmot w maju nie szkodzi, sad dobrze obrodzi.","Kiedy w maju wiatr z północy, ma się u nas zimno w nocy."],"5-12":["Pankracy, Serwacy i Bonifacy — źli na ogrody chłopacy.","Zimni Ogrodnicy: Pankracy, Serwacy, Bonifacy — trzy mroźne dni."],"5-13":["Serwacy mroźny — drzewa owocowe cierpią.","Gdy w maju dobry Serwacy, dobry w czerwcu Bonifacy."],"5-14":["Bonifacy z lodem — ogrodnicy płaczą.","Pankracy, Serwacy, Bonifacy, każdy swoim zimnem raczy."],"5-15":["Pankracy, Serwacy i Bonifacy dla drzew wielcy niedobracy.","Przed Pankracym nie ma lata, po Bonifacym mróz ulata.","Po Zimnej Zofii — mróz odpuszcza."],"5-16":["Po zimnych ogrodnikach — ciepło pewne.","Jeśli w maju grzmot, rośnie wszystko w lot."],"5-17":["Kiedy lipa w maju kwitnie, to w ulach miód zawiśnie.","Jeśli w maju często grzmot, rośnie wszystko w lot."],"5-18":["Gdy kukułka kuka w maju, spodziewaj się urodzaju.","Dużo chrabąszczy w maju, proso będzie niby w gaju."],"5-19":["Gdy kukułka kuka w maju, spodziewaj się urodzaju.","Jeśli w maju śnieg się zdarzy, to lato dobrze wyparzy."],"5-20":["Gdy maj jest przy pogodzie, nie bywają siana w szkodzie.","Gdy się maj z grzmotem odezwie na wschodzie, rok sprzyja sianu i zbożu."],"5-21":["Gdy się maj z grzmotem odezwie na wschodzie, rok sprzyja sianu i zbożu w urodzie.","Na Jana Nepomucena wiadoma już zboża cena."],"5-22":["Grzmot w maju nie szkodzi, sad dobrze obrodzi.","Maj bogaty sieje kwiaty."],"5-23":["Grzmot w maju sprzyja urodzaju.","Gdy się w maju pszczoły roją, takie roje w wielkiej cenie stoją."],"5-24":["Majowe błoto, więcej niż złoto.","Gdy w Zuzannę burze, jesienią pełne podwórze."],"5-25":["Na świętego Urbana dobre wino w beczułce schowane.","Gdy deszcz na świętego Urbana, mały profit z winobrania.","Na Urbana chwile jakie, mówią, że i lato takie."],"5-26":["Jeśli w maju grzmot, rośnie wszystko w lot.","Częste w maju grzmoty rozpraszają chłopom zgryzoty."],"5-27":["Maj — bydłu daj, a sam za piec uciekaj.","Częste deszcze w całym maju chleb i siano nam dawają."],"5-28":["Chłodny maj, dobry urodzaj.","Kiedy lipa w maju kwitnie, to w ulach miód zawiśnie."],"5-29":["Deszcz majowy, chleb gotowy.","Gdy na Magdalenę pogoda, to wygoda, gdy zaś słota, to lichota."],"5-30":["Kiedy mokry maj, będzie żyto jako gaj.","Na pierwszego maja szron obiecuje dobry plon."],"5-31":["Pierwszego maja deszcz, nieurodzaju wieszcz.","Gdy maj jest przy pogodzie, nie bywają siana w szkodzie.","Deszcz na Nawiedzenie Panny potrwa pewno do Zuzanny."],"6-1":["Czerwiec daje dni gorące, kosa brzęczy już na łące.","Czerwiec na maju zwykle się wzoruje, jego pluchy, pogody często naśladuje."],"6-2":["Czerwiec daje dni gorące, kosa brzęczy już na łące.","Czerwiec stały, grudzień doskonały."],"6-3":["Czerwiec stały, grudzień doskonały.","Czerwiec po deszczowym maju, często dżdżysty w naszym kraju."],"6-4":["Gdy czerwiec chłodem i wodą szafuje, to zwykle rok cały popsuje.","Czerwiec nosi dni gorące, kosa dzwoni już na łące."],"6-5":["Czerwiec na maju zwykle się wzoruje, jego pluchy, pogody, często naśladuje.","Dobry w czerwcu Bonifacy, gdy w maju dobry Serwacy."],"6-6":["Siej na świętego Norberta, będzie jęczmienia sterta.","Czerwiec po deszczowym maju, często dżdżysty w naszym kraju."],"6-7":["Norbert, Robert, Medard to bracia młodzi, spodziewajcie się powodzi.","Czerwiec gdy zagrzmi, gdzie zorze zachodzą, ryby się obficie urodzą."],"6-8":["Medard deszczem obdarzył — czterdzieści dni deszczem straszył.","Na Medarda jak pada — przez czterdzieści dni nie ustaje woda.","Medard suchy — czterdzieści dni bez deszczu."],"6-9":["Po Medardzie czterdzieści dni niezmienne.","Kiedy kwitnie w czerwcu bób, to największy wtedy głód, a kiedy mak, to już nie tak."],"6-10":["Gdy czerwiec chłodem i wodą szafuje, to zwykle rok cały popsuje.","Od czerwca dużo zależy, czy żniwa będą jak należy."],"6-11":["Na świętego Barnabę idź kosić trawę.","W czerwcu się pokaże, co nam Bóg da w darze."],"6-12":["Na św. Onufry otwierajcie kufry.","Gdy czerwiec chłodem i wodą szafuje, to zwykle rok cały popsuje."],"6-13":["Antoni z Padwy — kto zguby szuka, znajdzie.","Święty Antoni o gryce siać przypomni."],"6-14":["Pełnia czerwcowa — burza gotowa.","Czerwiec nosi dni gorące, kosa dzwoni już na łące."],"6-15":["Gdy przychodzi Witus suchy, tedy wiedzie z sobą muchy.","Na świętego Wita zboże zakwita.","Czerwiec na maju zwykle się wzoruje, jego pluchy, pogody, często naśladuje."],"6-16":["W czerwcu grusze kwiat zrzucają, czereśnie się zapalają.","Kiedy kwitnie w czerwcu bób, to największy wtedy głód, a kiedy mak, to już nie tak."],"6-17":["W czerwcu się okaże, co nam Bóg da w darze.","Grzmoty czerwca rozweselają rolnikom serca."],"6-18":["Nie trzeba w czerwcu o deszcz prosić, przyjdzie jak zaczniemy kosić.","Na Elżbiety kiedy leje, złe latu robi nadzieje."],"6-19":["Od czerwca dużo zależy, czy żniwa będą jak należy.","Na świętego Gerwazego jest w ogrodzie coś pięknego."],"6-20":["Grzmoty czerwca rozweselają rolnikom serca.","Na początku lata ranne grzmoty są zapowiedzią rychłej słoty."],"6-21":["Na Alojzego — dzień najdłuższy.","Letnie przesilenie — słońce na szczycie."],"6-22":["Gdy słońce w Raka z grzmotem wschodzi, to posuchę zwykle przynosi.","Czerwiec zimny i wilgotny, całemu roku bardzo psotny."],"6-23":["Gdzie sobótki palą, tam grady nie przeszkadzają.","Na Sobótkę dziewczęta kwiatami się ozdabiają."],"6-24":["Gdy się Jan Chrzciciel w dżdżystej kąpie wodzie, deszcze żniwom bywają wtenczas na przeszkodzie.","Jak się Janek kąpie w wodzie, żniwom deszcze na przeszkodzie.","Na Jana kąp się w rzece, zdrowie do ciała płynie."],"6-25":["Chrzest Jana w deszczowej wodzie, trzyma zbiory na przeszkodzie.","Czerwiec gdy zagrzmi, gdzie zorze zachodzą, ryby się obficie zrodzą."],"6-26":["W czerwcu pełnia sprowadza burze, ostatnia kwadra zaś deszcze duże.","Czerwiec mokry po zimnym maju, chłopom w jesieni będzie jak w raju."],"6-27":["Pełnia czerwcowa - burza gotowa.","Czerwiec się czerwieni, będzie dość w kieszeni."],"6-28":["Czerwiec daje dni gorące, kosa brzęczy już na łące.","Czerwiec grudniową pogodę głosi, lipiec dla stycznia wróżbę przynosi."],"6-29":["Gdy Piotr z Pawłem w deszcz uderzy, słońce za mgłą tydzień leży.","Po świętym Pawle i Piotrze muchy tłuste jak wieprze."],"6-30":["W czerwcu grusze kwiat zrzucają, czereśnie się zapalają.","W czerwcu się okaże, co nam Bóg da w darze."],"7-1":["Gdy Halina łąki zrosi, rolnik w wodzie siano kosi.","Gdy lipiec z deszczem, zima będzie z wiatrem.","Lipcowe upały, wrzesień doskonały."],"7-2":["Gdy pająk w lipcu przychodzi, to za sobą deszcz przywodzi, gdy swą pajęczynę snuje, bliską burzę czuje.","Kiedy lipiec daje deszcze, długie lato będzie jeszcze."],"7-3":["Gdy w lipcu słońce dopieka, burza niedaleka.","Kto w lipcu patrzy chłodu, nacierpi się w zimie głodu."],"7-4":["Gdy się grzmot w lipcu od południa poda, drzewom się znaczy szwank i nieuroda.","W lipcu gdy służą pogody, bój się wielkiej wody."],"7-5":["Jeśli upały w sianokosy i żniwa, to zima ostra i dokuczliwa, a jeżeli słota, to w zimie dużo błota.","W lipcu pszczeli rój, nie opłaci trudu znój."],"7-6":["Kto w lipcu patrzy chłodu, nacierpi się w zimie głodu.","Czego lipiec nie dowarzy, tego sierpień nie dosmaży."],"7-7":["Kwiat lipcowy, napój zdrowy.","Deszcze na lipca pierwszego, drugiego, zapowiedzią deszczu czterdziestodniowego."],"7-8":["Lipcowe deszcze dla chłopa kleszcze; jak pogoda, większa swoboda.","Jak deszcz na świętego Prokopa, to zgnije niejedna kopa."],"7-9":["Gdy się pająk w lipcu przechodzi, ze sobą deszcz przywodzi, gdy swą pajęczynę psuje, bliską burzę czuje.","W lipcu się kłosek korzy, że niesie dar boży, a najpierwsza Małgorzata, sierp w zboże założy."],"7-10":["Lipcowe upały, wrzesień doskonały.","Filip przepowiada, ile tygodni popada."],"7-11":["W lipcu upały, styczeń mroźny cały.","Lipcowe upały, wrzesień doskonały."],"7-12":["Lipiec — ostatek chleba wypiec.","Upały lipcowe wróżą mrozy styczniowe."],"7-13":["Miesiąc lipiec musi przypiec i ostatki mąki wypiec.","Gdy Amelia pogodna, będzie jesień dorodna."],"7-14":["Upały lipcowe, mrozy styczniowe.","Jak po lipcu gorącym sierpień się ochłodzi, to później zima z wielkim śniegiem chodzi."],"7-15":["W lipcu upały, styczeń mroźny cały.","W lipcu pszczeli rój, nie opłaci trudu znój."],"7-16":["Upały lipcowe, mrozy styczniowe.","W lipcu gdy służą pogody, bój się wielkiej wody."],"7-17":["Gdy lipiec z deszczem, zima będzie z wiatrem.","W lipcu upały, styczeń mroźny cały."],"7-18":["Jeżeli w żniwa mysz w polu gniazdo wysoko zakłada, znak to, że zima srogie śniegi zapowiada.","Jaka Małgorzatka, takie będzie pół latka."],"7-19":["Czego lipiec nie dowarzy, tego sierpień nie dosmaży.","Święta Małgorzata zapowiada środek lata."],"7-20":["Na Eliasza burze i pioruny — rolnicy się kłaniają.","Eliasz deszczem albo suszą rządzi.","Na świętą Małgorzatę kopa zawsze w polu stanie."],"7-21":["Kiedy lipiec daje deszcze, długie lato będzie jeszcze.","Gdy listki ziemniaków w górę spoglądają, to nam na pogodę znak pewny dają."],"7-22":["Z Magdaleną nam kanikuła wschodzi, święty Bartłomiej ją odwodzi.","Miesiąc lipiec musi przypiec i ostatki mąki wypiec."],"7-23":["Jak poranek mglisty, wieczór przezroczysty.","Z Magdaleną nam kanikuła wschodzi, święty Bartłomiej ją odwodzi."],"7-24":["Czego lipiec i sierpień nie dowarzy, tego wrzesień nie usmaży.","Gdy pająk w lipcu przychodzi, to za sobą deszcz przywodzi, gdy swą pajęczynę snuje, bliską burzę czuje."],"7-25":["Na świętego Jakuba ostatnia już siewów pora.","Na Jakuba deszcz, złych żniw wieszcz.","Na święty Jakub chleba sobie nakup."],"7-26":["Szczęśliwy, kto na Annę wyszuka sobie pannę.","Święta Anka pasie baranka."],"7-27":["Gdy w lipcu słońce dopieka, burza niedaleka.","Na Jakuba deszcz, złych żniw wieszcz."],"7-28":["Gdy się grzmot w lipcu od południa poda, drzewom się znaczy szwank i nieuroda.","Lipcowe upały, wrzesień doskonały."],"7-29":["Około dnia świętej Marty, ze żniwami już nie żarty.","Około świętej Marty płać za żniwo, dawaj kwarty."],"7-30":["Jak po lipcu gorącym sierpień się ochłodzi, to później zima z wielkim śniegiem chodzi.","Miesiąc lipiec musi przypiec i ostatki mąki wypiec."],"7-31":["Gdy lipiec z deszczem, zima będzie z wiatrem.","Jeśli upały w sianokosy i żniwa, to zima ostra i dokuczliwa, a jeżeli słota, to w zimie dużo błota."],"8-1":["W pierwszym tygodniu pogoda stała, będzie zima długa, biała.","Jeśli w sierpniu dni jasne, będą stodoły ciasne.","Kiedy sierpień przychodzi, reszta zboża z pola schodzi."],"8-2":["Na święty Gustaw kopy w polu ustaw.","Jakim pierwszy, drugi ćmi, takie sierpnia, września dni."],"8-3":["Pogoda na Nikodema — cały miesiąc deszczu nie ma.","Jak na Piotra posuszy, lato jesień przesuszy."],"8-4":["Gdy ciepło na Dominika, ostra zima nas dotyka.","Jak pada na Prokopa, zmoknie mendel, zmoknie kopa."],"8-5":["Gdy w dni sierpnia spieka wszędzie, tedy długa zima będzie.","W pierwszym tygodniu sierpnia spieka, zima ciężka, śnieżna i długa nas czeka."],"8-6":["W Przemienienie Pańskie są burze szatańskie.","Gdy z początku sierpień częste grzmoty miewa, tedy też do końca takąż nutkę śpiewa."],"8-7":["Święty Kajetanie, strzeż od deszczu sprzątanie.","Gdy sierpień w upały zbywa lato długie zwykle bywa."],"8-8":["Kiedy sierpień przychodzi, reszta zboża z pola schodzi.","Gdy z początku sierpień częste grzmoty miewa, tedy też do końca takąż nutkę śpiewa."],"8-9":["Czego sierpień nie dowarzy, tego wrzesień nie doparzy.","Kto w lecie nie zbiera, w zimie głodem przymiera."],"8-10":["Na świętego Wawrzyńca szykują się żeńcy do wieńca.","Gdy na Wawrzyńca orzechy obrodzą, to w zimie mrozy dogodzą.","Na Wawrzyńca — noc spadających gwiazd."],"8-11":["Od świętej Klary są już ładne dary.","Na święty Wawrzyniec lata już wnet koniec."],"8-12":["Gdy w sierpniu z północy dmucha, następuje zwykle posucha.","Gdy gęś chodzi w sierpniu po lodzie, to w listopadzie chodzi po wodzie."],"8-13":["Jeżeli w sierpniu gorąco będzie, to zima w śniegi długo zasiędzie.","Gdy gęś chodzi w sierpniu po lodzie, to w listopadzie chodzi po wodzie."],"8-14":["Początki sierpnia pogodne, wróżą zimy łagodne.","Gdy z początku sierpnia skwar trzyma, zwykle bywa długa i śnieżna zima."],"8-15":["Od Wniebowzięcia miej w stodole połowę żęcia.","Na Wniebowzięcie słota, w jesieni dużo błota.","Na Zielną — zioła poświęcone w ręku."],"8-16":["Na święty Roch w stodole groch.","Na święty Roch, jaki dzień, taka noc."],"8-17":["Jeśli w dniu Jacka nie pada, suchą jesień zapowiada.","Kto w lecie nie zbiera, w zimie głodem przymiera."],"8-18":["Żołędzie pełne i białe, przyszłe lato doskonałe.","Co się w lecie zarobi, tym się w zimie żyje."],"8-19":["Kiedy sierpień wrzos rozwija, jesień krótka, szybko mija.","Jeżeli w sierpniu gorąco będzie, to zima w śniegi długo zasiędzie."],"8-20":["Jeśli na Bernarda ziemia twarda, to będzie zima harda, a jak miękka to lekka.","Kto w lecie nie orze, nie sieje, w zimie z frasunku niszczeje."],"8-21":["Jeśli piękny sierpień, gotuj sobie chłopku kieszeń.","Kiedy w sierpniu spieka wszędzie, zima długo białą będzie."],"8-22":["Jeśli w sierpniu dni jasne, będą stodoły ciasne.","Kto latem pracuje, zimą głodu nie czuje."],"8-23":["W sierpniu grzmotów wiele, mokrą zimę ściele.","Gdy słońce z grzmotem w znak Panny wchodzi, zapowiedź to niepogody długiej i powodzi."],"8-24":["Bartłomiej ukazuje, jaka jesień następuje.","Jaki dzień Bartłomieja, takiej jesieni nadzieja.","Gdy Bartłomiej z grzmotami, śnieżna zima przed nami."],"8-25":["Gdy sierpień w upały zbywa, lato długie zwykle bywa.","Na Ludwika zboże z pola umyka."],"8-26":["Czego sierpień nie dowarzy, tego wrzesień nie doparzy.","W sierpniu mgły w górach — mroźne Gody, kiedy mgły w dolinach — to wróżba pogody."],"8-27":["Gdy w dni sierpnia spieka wszędzie, tedy długa zima będzie.","Kto latem pracuje, zimą głodu nie czuje."],"8-28":["Sierpień pogodny jest dla winogron wygodny.","Dużo grzybów sierpniowych, dużo zawiei śniegowych."],"8-29":["Dużo grzybów sierpniowych, dużo zawiei śniegowych.","Początki sierpnia pogodne, wróżą zimy łagodne."],"8-30":["Jak po lipcu sierpień się ochłodzi, to później zima twarda z wielkim śniegiem chodzi.","W sierpniu grzmotów wiele, mokrą zimę ściele."],"8-31":["Ostatni sierpnia zapowiada, jaka pogoda na wrzesień wypada.","Kiedy sierpień wrzos rozwija, jesień krótka, szybko mija."],"9-1":["Święty Idzi wiedzie wrzesień, wnet nadejdzie dżdżysta jesień.","Gdy na święty Idzi ładnie, śnieg na pewno późno spadnie."],"9-2":["Jeśli wrzesień będzie suchy, październik nie oszczędzi nam pluchy.","Jaki pierwszy wrzesień, taka będzie jesień."],"9-3":["Wrzeszczy wrzesień, że już jesień.","Jeśli wrzesień z pogodą zaczyna, zwykle przez miesiąc pogoda trzyma."],"9-4":["Gdy nadejdzie wrzesień, rolnik ma zawsze pełną kieszeń.","Jak we wrześniu krety kopią po nizinach, będzie wietrzno, ale lekka zima."],"9-5":["Gdy wrzesień bez deszczów będzie, w zimie wiatrów pełno wszędzie.","Im głębiej we wrześniu grzebią się robaki, tym srożej się zima da ludziom we znaki."],"9-6":["Jak we wrześniu krety kopią po nizinach, będzie wietrzno, ale lekka zima.","Gdy wrzesień z pogodą zaczyna, zwykle przez miesiąc pogoda się trzyma."],"9-7":["Święta Regina mgły rozpina.","Święta Regina gałęzie ugina."],"9-8":["Na Matkę Boską Siewną siej, kiedy czas sprzyja.","Sieje się na Siewną — wschodzi na wiosnę.","Na Siewną — zboże ozime w ziemię."],"9-9":["Gdy grzyby wielkie korzenie mają, wielką zimę zapowiadają.","Na świętego Łukasza jest w domu chleb i kasza."],"9-10":["Wrzesień chodzi po rosie, zbiera grzyby we wrzosie.","Gdy na Jacka pogodnie, suche w jesieni dnie."],"9-11":["Ze wszystkich świętych najlepszy Jacek, bo kto żyje dostał placek.","Jeśli na świętego Prota jest pogoda albo słota, to na świętego Hieronima deszczyk jest, albo go ni ma."],"9-12":["Jeśli wrzesień będzie ciepły i suchy, pewno październik nie oszczędzi pluchy.","Wrzesień jeszcze w słońcu chodzi, babie lato już się rodzi."],"9-13":["Czym dłużej jaskółki we wrześniu zostają, tym dłużej piękne i jasne dni bywają.","Jaką pogodę na nowiu da wrzesień, taka bywa zwykle przez całą jesień."],"9-14":["Na Podwyższenie Świętego Krzyża jesień się przybliża.","Gdy wrzesień bez deszczów będzie, w zimie wiatrów pełno wszędzie."],"9-15":["Pogoda na Nikodema — niedziel cztery deszczu nie ma.","Jaki pierwszy wrzesień, taka będzie jesień."],"9-16":["Im głębiej we wrześniu grzebią się robaki, tym srożej się zima da ludziom we znaki.","Na świętego Teodora zapełniona komora."],"9-17":["Jaką pogodę na nowiu da wrzesień, taka bywa zwykle przez całą jesień.","Gdy Kleofas we mgle chodzi, mokrą zimę zwykle zrodzi."],"9-18":["Kiedy Irena z mrozem przybywa, babie lato krótkie bywa.","Gdy we wrześniu grzybów brak, niezawodny zimy znak."],"9-19":["Wrzesień wrzosami strojny, lecz od pracy znojny.","Kiedy Irena z mrozem przybywa, babie lato krótkie bywa."],"9-20":["Gdy we wrześniu grzybów brak, niezawodny zimy znak.","Gdy grzyby wielkie korzenie mają, wielką zimę zapowiadają."],"9-21":["Na świętego Mateusza dostanie kapusta kapelusza.","Na święty Mateusz jeśli mróz, jeszcze sanie do szopy włóż."],"9-22":["Czego lipiec i sierpień nie dowarzy, tego wrzesień nie dosmaży.","Jeśli Maurycy ma jasne lice, to przyprowadzi wnet nawałnicę."],"9-23":["Skoro wrzesień, to już jesień, ale jabłek pełna kieszeń.","Na równonoc jesienną — noc z dniem równy."],"9-24":["Na Gerarda, gdy sucho, zima będzie z pluchą.","Gerard czasem wróży na to, że z nim przyjdzie drugie lato."],"9-25":["Wrześniowa słota, miarka deszczu, korzec błota.","Gdy Kleofas we mgle chodzi, mokrą zimę zwykle zrodzi."],"9-26":["Czego lipiec i sierpień nie dowarzy, tego wrzesień nie dosmaży.","We wrześniu, gdy tłuste ptaki, srogo się zima da ludziom we znaki."],"9-27":["Wrzesień wrzosami strojny, lecz od pracy znojny.","Straszna jest wrześniowa słota - miarka deszczu, korzec błota."],"9-28":["Na świętego Wacława w polu pustki, w domu sława.","Gdy na Wacława i Michała jasno, nie będzie w zimie ciasno."],"9-29":["Jeśli bociany do Michała zostały, nie będzie mrozów przez grudzień cały.","Gdy noc jasna na Michała, to nastąpi zima trwała.","Święty Michał lato przekichał."],"9-30":["Gdy wrzesień z pogodą zaczyna, zwykle przez miesiąc pogoda się trzyma.","Jeśli na świętego Prota jest pogoda albo słota, to na świętego Hieronima deszczyk jest, albo go ni ma.","Kiedy wrzesień, to już jesień, wtedy jabłek pełna kieszeń."],"10-1":["Gdy październik z wodami, grudzień z wiatrami.","Gdy październik mroźny, to nie będzie styczeń groźny."],"10-2":["Gdy jesień zamglona, zima zaśnieżona.","Gdy w październiku ciepło chadza, w lutym mrozy naprowadza."],"10-3":["Październik chodzi po kraju, cichnie ptactwo w gaju.","Gdy w październiku ciepło chadza, w lutym mrozy naprowadza."],"10-4":["Na świętego Franciszka odlatuje pliszka.","Gdy październik ciepło trzyma, zwykle mroźna bywa zima.","Gdy październik ze śniegiem przybieży, na wiosnę długo śnieg na polach leży."],"10-5":["W październiku, gdy liść z drzewa niesporo opada, późną to wiosnę zapowiada.","Gdy w październiku ciepło chadza, w lutym mrozy naprowadza."],"10-6":["W październiku kawek gromada, słotne dni nam zapowiada.","Gdy październik mroźny, to nie będzie styczeń groźny."],"10-7":["Październik chodzi po kraju, cichnie ptactwo w gaju.","Kiedy październik śnieżny i chłodny, to styczeń zwykle łagodny."],"10-8":["Ile razy przed nowiem w październiku śnieg spadnie, tyle razy wśród zimy odwilży przypadnie.","Po świętej Brygidzie babie lato przyjdzie."],"10-9":["Gdy październik z wodami, grudzień z wiatrami.","Kiedy październik śnieżny i chłodny, to styczeń zwykle łagodny."],"10-10":["Październik spoczynku nie chce dać, każe orać, każe siać.","Na świętego Franciszka odlatuje pliszka."],"10-11":["Gdy październik ostro trzyma, zwykle potem ostra zima.","Październik spoczynku nie chce dać, każe orać, każe siać."],"10-12":["Gdy październik mokro trzyma, zwykle potem ostra zima.","Gdy październik ostro trzyma, zwykle potem ostra zima."],"10-13":["Na Edwarda jesień twarda.","Gdy październik ciepło trzyma, zwykle mroźna bywa zima."],"10-14":["Liść na drzewie mocno trzyma, nie tak prędko przyjdzie zima.","Gdy październik mokro trzyma, zwykle potem ostra zima."],"10-15":["Liść na drzewie mocno trzyma, nie tak prędko przyjdzie zima.","Kto sieje na świętą Jadwigę, ten zbiera figę."],"10-16":["Gdy jesień zamglona, zima zaśnieżona.","Kto sieje na świętą Jadwigę, ten zbiera figę."],"10-17":["Październik ciepły, będzie luty skrzepły.","Październik chodzi po kraju, wygania ptactwo z gaju."],"10-18":["Październik chodzi po kraju, wygania ptactwo z gaju.","Na świętego Łukasza jest w domu chleb i kasza."],"10-19":["Idzie jesień, a tu pusta kieszeń.","Październik ciepły, będzie luty skrzepły."],"10-20":["Kiedy w październiku mrozy i zawieje, w styczniu ciepłe słonko pewnie zajaśnieje.","Idzie jesień, a tu pusta kieszeń."],"10-21":["Święta Urszula perły rozsuła.","Od świętej Urszuli chłop się kożuchem otuli."],"10-22":["Ile razy przed nowiem w październiku śnieg spadnie, tyle razy wśród zimy odwilży przypadnie.","Święta Urszula i Kordula dzieci do pieca przytula."],"10-23":["W jesieni prędko gdy liść z drzewa spadnie, to wkrótce zima będzie, każdy zgadnie.","Gdy październik ciepło trzyma, zwykle mroźna bywa zima."],"10-24":["Jaki październik, taki marzec, doznał tego niejeden starzec.","W jesieni prędko gdy liść z drzewa spadnie, to wkrótce zima będzie."],"10-25":["Październik, bo paździerze baba z lnu cierlicą bierze.","Jaki październik, taki marzec, doznał tego niejeden starzec."],"10-26":["Jesień bezdeszczowa to zima wiatrowa.","Pierwszy śnieg w październiku, gdy na błoto pada, łagodną zimę zapowiada."],"10-27":["Jesień bezdeszczowa to zima wiatrowa.","Na świętego Szymona i Judy spodziewają się śniegu i grudy."],"10-28":["Na świętego Szymona i Judy spodziewają się śniegu i grudy.","Jak przyjdzie Szymon i Judy, zagoń bydło z pola do budy."],"10-29":["Gdy jesień zamglona, zima zaśnieżona.","Gdy październik mroźny, to nie będzie styczeń groźny."],"10-30":["Gdy październik ze śniegiem przybieży, na wiosnę długo śnieg na polach leży.","Miesiąc październy, marca obraz wierny."],"10-31":["Październik stoi u dwora, wykop ziemniaki pora.","Październik chodzi po kraju, cichnie ptactwo w gaju.","Gdy październik mokro trzyma, zwykle potem ostra zima."],"11-1":["Na Wszystkich Świętych ziemia skrzepła, to będzie zima ciepła, a jak deszcz, to trzeba będzie za piec wleźć.","Na Wszystkich Świętych od zrębu utnij gałąź dębu – jeśli soku nie ma, tęga będzie zima.","Jeśli śnieg na Wszystkich Świętych zawiedzie, to święty Marcin na białym koniu przyjedzie."],"11-2":["Niebo płacze, ludzie płaczą, a ubogich chlebem raczą, rozdając jałmużnę, za duszyczki różne.","Wszyscy Święci — śnieg się kręci, a w Zaduszki — dżdży jak ze strużki."],"11-3":["Kiedy swego czasu goły las nastaje, święty Hubert z lasu cały obiad daje.","Jaki listopad trzeci, taki marzec się kleci."],"11-4":["Deszcze listopadowe budzą wiatry zimowe.","Gdy listopad mroźny, to lipiec nie groźny."],"11-5":["Gdy w listopadzie liść na szczytach drzew się trzyma, to w maju na nowe liście spadnie jeszcze zima.","Deszcz z początkiem listopada, mrozy w styczniu zapowiada."],"11-6":["W listopadzie kapusty pełne kadzie.","Gdy w listopadzie gawrony gromadnie latają, deszcze albo śniegi zapowiadają."],"11-7":["Jaka pogoda listopadowa, taka i marcowa.","Gdy w listopadzie liść na szczytach drzew się trzyma, to w maju na nowe liście spadnie jeszcze zima."],"11-8":["Gdy łagodna jesień trzyma, będzie krótka, ostra zima.","Jaki listopad, taki będzie marzec, prorokuje stuletni starzec."],"11-9":["W listopadzie goło w sadzie.","Kiedy zima w listopadzie, jeszcze w kwietniu zimno się kładzie."],"11-10":["Gdy w listopadzie wody się podniosą, to snadź w zimie deszcze roszą.","Gdy łagodna jesień trzyma, będzie krótka, ostra zima."],"11-11":["Na świętego Marcina zima się zaczyna.","Gdy gęś na Marcina po lodzie chodzi — zima długo nie odchodzi.","Święty Marcin na białym koniu jedzie — zima za nim."],"11-12":["Od świętego Marcina zima się zaczyna.","Jaka pogoda w listopadzie służy, taka na marzec się wróży."],"11-13":["Na Stanisława Kostkę ujrzysz śniegu drobnostkę, a na Ofiarowanie przydadzą się sanie.","Witold w listopadzie grzmi, rolnik wiosną śni."],"11-14":["Jeśli kret w listopadzie jeszcze późno ryje, na Nowy Rok komar wpadnie w bryję.","Listopad marcowi za rodzica służy i marcowe psoty wróży."],"11-15":["Deszcz w połowie listopada, tęgi mróz w połowie stycznia zapowiada.","Deszcz w połowie listopada, tęgi mróz w styczniu zapowiada."],"11-16":["Grzmot listopada dużo zboża zapowiada.","Deszcz w Marka, ziemia w lecie jak skwarka."],"11-17":["Deszcz w początku listopada, mrozy w stycznia zapowiada.","W połowie listopada deszczy, w połowie stycznia trzeszczy."],"11-18":["Gdy listopad z deszczami, grudzień zwykle z wiatrami.","Gdy w listopadzie wody się podniosą, to snadź w zimie deszcze roszą."],"11-19":["Na świętą Elżbietę bywa śnieg nad piętę.","Zjawia to Elżbieta święta, czy ta zima będzie cięta."],"11-20":["W listopadzie mróz, szykuj w marcu wóz.","Jeśli kret w listopadzie jeszcze późno ryje, na Nowy Rok komar wpadnie w bryję."],"11-21":["Deszcze listopadowe budzą wiatry zimowe.","Gdy pogoda w Ofiarowanie, ostra zima nastanie."],"11-22":["Kiedy na świętą Cecylię grzmi, rolnik o dobry roku śni.","Grzmot listopada dużo zboża zapowiada."],"11-23":["Święty Klemens zimę zaczyna, święty Piotr ją kończy.","Listopad ciecze, marzec nie podpiecze."],"11-24":["Słońce listopada mrozy zapowiada.","Kwitną drzewa w listopadzie wszędzie, zima aż do maja będzie."],"11-25":["Święta Katarzyna adwent rozpoczyna.","Gdy listopad z deszczem, grudzień zwykle z wiatrem."],"11-26":["Jaki listopad, taki będzie marzec, prorokuje stuletni starzec.","W połowie listopada deszczy, w połowie stycznia trzeszczy."],"11-27":["Gdy zbyt długo złota jesień trzyma, nagle przyjdzie zima.","Gdy w listopadzie liść na szczytach drzew trzyma, to w maju na nowe liście spadnie jeszcze zima."],"11-28":["Słońce listopada mrozy zapowiada.","Kiedy Zdzisiek rano szroni zima jest w zasięgu dłoni."],"11-29":["Grzmot listopada dużo zboża zapowiada.","Deszcz w początku listopada, mrozy w styczniu zapowiada."],"11-30":["Na świętego Andrzeja trza kożucha dobrodzieja.","Święty Andrzej Ci ukaże, co Ci los przyniesie w darze.","Lej wosk na Andrzeja — los odczytaj."],"12-1":["Jaki pierwszy dzień miesiąca, taki będzie aż do końca.","Jak się grudzień zaczyna, taka ma być cała zima."],"12-2":["W pierwszym tygodniu grudnia pogoda stała, będzie zima długa, biała.","Jeśli w grudniu często dmucha, to w marcu i kwietniu plucha."],"12-3":["Grudzień jak łagodny wszędzie, cała zima dzieckiem będzie.","Suchy grudzień stoi za to, że sucha będzie wiosna i suche lato."],"12-4":["Święta Barbara po lodzie, Boże Narodzenie po wodzie.","Gdy Barbara z deszczem — Boże Narodzenie ze śniegiem."],"12-5":["Piąty grudzień stycznia czyni znaki.","Pogoda grudniowa — wody połowa, lodu połowa."],"12-6":["Grudzień z grzmotami, rok z wiatrami.","Na Mikołaja dzieci na prezenty czekają.","Na Mikołaja porzuć wóz i zaprzęż sanie."],"12-7":["Święty Ambroży zimy przysporzy.","Na święty Ambroży poprawią się mrozy."],"12-8":["Mroźny grudzień, wiele śniegu, żyzny roczek będzie w biegu.","Po suchym grudniu sucha wiosna bywa i pogoda we żniwa."],"12-9":["Grudzień to miesiąc zawiły, czasem srogi, czasem miły.","Silne i częste wiatry w grudniu są wróżbą wielkich deszczów w marcu i kwietniu."],"12-10":["Gdy ptaki o północy latają, mroźną zimę przepowiadają.","Pogoda grudniowa — wody połowa, lodu połowa."],"12-11":["Suchy grudzień stoi za to, że sucha będzie wiosna i suche lato.","Pogoda grudniowa — lodu połowa, wody połowa."],"12-12":["W zimie odkryte ucho, to w lecie sucho.","Dłużej świat zima ziębi, niż lato zagrzewa."],"12-13":["Łucja dnia przyczyni czy nocy — ciemności nie zmniejszy.","Święta Łucja dnia przyrzuca.","Po świętej Łucji dzień trwa najkrócej."],"12-14":["W pierwszym tygodniu grudnia, gdy pogoda stała, będzie zima długo biała.","Taką pogodę Nowy Rok przynosi, jaka na Jana od Krzyża się głosi."],"12-15":["Jak w zimie piecze, to w lecie ciecze.","Czym w grudniu większy mróz, tym do worka zboże bardziej włóż."],"12-16":["Grudzień zimny, śniegiem przykryty, daje rok w zboże obfity.","Gdyby kiedy w grudniu grzmiało, wiatrów byłoby niemało."],"12-17":["W grudniu rzeki kryją lody, a lud cieszy się na Gody.","Grudzień ostro mrozi drogi, wieprze bije, drwa znosi dla zimowej trwogi."],"12-18":["Mroźny grudzień, wiele śniegu, żyzny roczek będzie w biegu.","Gdy w grudniu śnieg pada, drugi rok taki sam zapowiada."],"12-19":["Grudzień z grzmotami, rok z wiatrami.","Pogoda na Urbana, to wielka wygrana."],"12-20":["Gdy ciepło na Dominika, ostra zima nas dotyka.","Na świętego Dominika głucho wszędzie, śpiew ptactwa zanika."],"12-21":["Na Tomasza — przesilenie zimowe.","Najkrótszy dzień roku — słońce zawraca.","Na Tomasza najdłuższa noc nasza."],"12-22":["Gdy łagodna jesień trzyma, będzie krótka, ostra zima.","Grudzień ostro mrozi drogi, wieprze bije, drwa znosi dla zimowej trwogi."],"12-23":["Grudzień jaki, czerwiec taki.","Im więcej zimą wody, tym więcej wiosną pogody."],"12-24":["Jak w Wigilię z dachu ciecze, zima długo się przewlecze.","Gdy na Wigilię gwiazda wyraźna — rok dobry.","Jakiś we Wiliją, takiś cały rok."],"12-25":["Boże Narodzenie ze śniegiem — Wielkanoc z kwieciem.","Gdy Boże Narodzenie zielone — Wielkanoc biała.","W jakim blasku Bóg się rodzi, w takim cały styczeń chodzi."],"12-26":["Jaka pogoda w Szczepana panuje, taka na luty nam się szykuje.","Na świętego Szczepana bywa błoto po kolana.","Szczepan mroźny, luty groźny."],"12-27":["Jak Jan Apostoł ośnieżony, św. Józef już zielony.","Jak Apostoł pokazuje, taki luty następuje."],"12-28":["Suchy grudzień stoi za to, że sucha wiosna i suche lato.","Niewiniątek dzień pokaże, jaka pogoda w marcu się okaże."],"12-29":["Zima starym dokucza, a młodych naucza.","Zima nie pyta, gdzie się lato podziało."],"12-30":["Kiedy grzmi na lód, będzie głód.","Jeśli w grudniu często dmucha, to w marcu wciąż plucha."],"12-31":["Jak Sylwester — taki cały rok nowy.","Dzień Sylwestrowy pokaże czas lipcowy.","Na Sylwestra hałasuj — złe duchy przepędź."]};

// Pelny algorytm Meeus (rozdz. 47-48, z perturbacjami) - ten sam sprawdzony wzor
// co index.html/kalendarz.html/fazy-ksiezyca.html (jedno zrodlo prawdy, patrz
// CLAUDE.md wzorzec bugow nr 3). Poprzednia wersja liczyla wiek prostym wzorem
// (znany moment nowiu + sredni okres synodyczny, bez perturbacji) - roznica wobec
// pelnego Meeusa siega do ~0,6 dnia w ciagu roku, co przy waskich (~1-dniowych)
// oknach nazw faz moglo dawac inna faze niz pozostale 4 implementacje na stronie.
function getMoonPhase(date) {
  const rad = Math.PI / 180;
  function toJD(y, m, d) { if (m <= 2) { y--; m += 12; } const A = Math.floor(y / 100); const B = 2 - A + Math.floor(A / 4); return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5; }
  const y = date.getFullYear(), mo = date.getMonth() + 1, d = date.getDate();
  const JD = toJD(y, mo, d) + 0.5;
  const T = (JD - 2451545.0) / 36525;
  const D = ((297.8501921 + 445267.1114034 * T - 0.0018819 * T * T + T * T * T / 545868) % 360 + 360) % 360;
  const M = ((357.5291092 + 35999.0502909 * T - 0.0001536 * T * T) % 360 + 360) % 360;
  const Mp = ((134.9633964 + 477198.8675055 * T + 0.0087414 * T * T + T * T * T / 69699) % 360 + 360) % 360;
  const F = ((93.2720950 + 483202.0175233 * T - 0.0036539 * T * T) % 360 + 360) % 360;
  const Lp = ((218.3164477 + 481267.88123421 * T - 0.0015786 * T * T) % 360 + 360) % 360;
  const dL = 6288774 * Math.sin(Mp * rad) + 1274027 * Math.sin((2 * D - Mp) * rad) + 658314 * Math.sin(2 * D * rad)
    + 213618 * Math.sin(2 * Mp * rad) - 185116 * Math.sin(M * rad) - 114332 * Math.sin(2 * F * rad)
    + 58793 * Math.sin((2 * D - 2 * Mp) * rad) + 57066 * Math.sin((2 * D - M - Mp) * rad)
    + 53322 * Math.sin((2 * D + Mp) * rad) + 45758 * Math.sin((2 * D - M) * rad)
    - 40923 * Math.sin((M - Mp) * rad) - 34720 * Math.sin(D * rad) - 30383 * Math.sin((M + Mp) * rad);
  const moonLon = ((Lp + dL / 1000000) % 360 + 360) % 360;
  // Dlugosc Slonca: srednia + rownanie srodka - sama srednia dawala ~3-4h bledu w
  // momencie zmiany fazy (bug znaleziony 12.09.2026 w fazy-ksiezyca.html, naprawione
  // tez tutaj tym samym sposobem, zweryfikowane niezaleznie na 3 terminach/miesiacach).
  const sunLonMean = ((280.46646 + 36000.76983 * T + 0.0003032 * T * T) % 360 + 360) % 360;
  const eqC = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(M * rad) + (0.019993 - 0.000101 * T) * Math.sin(2 * M * rad) + 0.000289 * Math.sin(3 * M * rad);
  const sunLon = ((sunLonMean + eqC) % 360 + 360) % 360;
  const elong = ((moonLon - sunLon) % 360 + 360) % 360;
  const SYNODIC = 29.53058867;
  const age = elong / 360 * SYNODIC;
  // Okna kardynalne wąskie (±0,5 dnia) — jak index.html/fazy-ksiezyca.html,
  // patrz komentarz tam. Nazwy ujednolicone z index.html/fazy-ksiezyca.html
  // (2026-08-29) — wcześniej ta strona używała innych słów dla tych samych faz.
  if (age < 0.5) return { phase:'Nów', symbol:'🌑', age:Math.round(age) };
  if (age < 6.88) return { phase:'Wzrastający sierp', symbol:'🌒', age:Math.round(age) };
  if (age < 7.88) return { phase:'Pierwsza kwadra', symbol:'🌓', age:Math.round(age) };
  if (age < 14.27) return { phase:'Wzrastający garb', symbol:'🌔', age:Math.round(age) };
  if (age < 15.27) return { phase:'Pełnia', symbol:'🌕', age:Math.round(age) };
  if (age < 21.65) return { phase:'Zanikający garb', symbol:'🌖', age:Math.round(age) };
  if (age < 22.65) return { phase:'Ostatnia kwadra', symbol:'🌗', age:Math.round(age) };
  return { phase:'Zanikający sierp', symbol:'🌘', age:Math.round(age) };
}

// Rownanie czasu Meeus niskiej precyzji (ten sam wzor co index.html/kalendarz.html,
// zamieniony 2026-08-29) - poprzedni wzor eot (-7.655*sin(g)+9.873*sin(2*lambda+3.588)+...)
// dawal blad ok. 10 minut na 29 sierpnia (liczyl +9,5 min zamiast prawdziwych -0,95 min),
// wykryte przy weryfikacji przeciw timeanddate.com.
function getSunTimes(date) {
  const lat = 52.23, lon = 21.01;
  const rad = Math.PI / 180;
  const y = date.getFullYear(), mo = date.getMonth() + 1, d = date.getDate();
  function toJD(y, m, d) { if (m <= 2) { y--; m += 12; } const A = Math.floor(y / 100); const B = 2 - A + Math.floor(A / 4); return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5; }
  // Parametry Slonca (deklinacja, rownanie czasu) sa liczone dla chwili samego wschodu/zachodu
  // (2 iteracje od poludnia UTC), a nie tylko dla poludnia - ten sam wzor co calcSunCore w
  // index.html/kalendarz.html/wschody-zachody.html (rms bledu 1,5-3 s zamiast 20-30 s).
  function solar(JD) {
    const T = (JD - 2451545.0) / 36525;
    const L0 = ((280.46646 + 36000.76983 * T + 0.0003032 * T * T) % 360 + 360) % 360;
    const M = ((357.52911 + 35999.05029 * T - 0.0001537 * T * T) % 360 + 360) % 360;
    const Mr = M * rad;
    const C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(Mr) + (0.019993 - 0.000101 * T) * Math.sin(2 * Mr) + 0.000289 * Math.sin(3 * Mr);
    const trueLon = L0 + C;
    const Omega = 125.04 - 1934.136 * T;
    const appLon = trueLon - 0.00569 - 0.00478 * Math.sin(Omega * rad);
    const eps0 = 23.439291 - 0.0130042 * T - 0.00000016 * T * T + 0.000000504 * T * T * T;
    const eps = eps0 + 0.00256 * Math.cos(Omega * rad);
    const dec = Math.asin(Math.sin(eps * rad) * Math.sin(appLon * rad));
    const RA = (Math.atan2(Math.cos(eps * rad) * Math.sin(appLon * rad), Math.cos(appLon * rad)) / rad + 360) % 360;
    let eotDeg = L0 - 0.0057183 - RA;
    if (eotDeg > 180) eotDeg -= 360; if (eotDeg < -180) eotDeg += 360;
    return { dec, eot: eotDeg * 4 / 60 }; // eot w godzinach
  }
  const JD0 = toJD(y, mo, d) + 0.5;
  const cosLat = Math.cos(lat * rad), sinLat = Math.sin(lat * rad);
  function eventHour(sign) { // sign: -1 = wschod, +1 = zachod; godziny UTC
    let p = solar(JD0), t = 0;
    for (let i = 0; i < 2; i++) {
      const cosH = (Math.cos(90.833 * rad) - sinLat * Math.sin(p.dec)) / (cosLat * Math.cos(p.dec));
      if (cosH > 1 || cosH < -1) return null;
      const H = Math.acos(cosH) * 180 / Math.PI;
      t = 12 - lon / 15 - p.eot + sign * H / 15;
      p = solar(JD0 + (t - 12) / 24);
    }
    return t;
  }
  const rise = eventHour(-1), set = eventHour(1);
  if (rise === null || set === null) return null;
  const offset = isPolandDST(y, mo, d) ? 2 : 1;
  return { rise: rise + offset, set: set + offset };
}

// Czas letni UE liczony wprost z daty docelowej (nie z przyblizonych stalych dni 29/25) — patrz index.html
function isPolandDST(year,month,day){
  if(month<3||month>10)return false;
  if(month>3&&month<10)return true;
  const lastSunday=(y,m)=>{const d=new Date(Date.UTC(y,m,0));const dow=d.getUTCDay();d.setUTCDate(d.getUTCDate()-dow);return d.getUTCDate();};
  if(month===3)return day>=lastSunday(year,3);
  return day<lastSunday(year,10);
}

function fmtTime(h) {
  let hh = Math.floor(h) % 24;
  let mm = Math.round((h - Math.floor(h)) * 60);
  if (mm === 60) { mm = 0; hh = (hh + 1) % 24; }
  return String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0');
}

function dayOfYear(d) {
  return Math.round((d - new Date(d.getFullYear(), 0, 0)) / 86400000);
}

// Numer tygodnia wg ISO 8601 (tydzień 1 = tydzień zawierający pierwszy czwartek roku, tygodnie
// od poniedziałku) — ta sama funkcja co na stronie głównej (index.html, getISOWeek). Poprzednia,
// naiwna implementacja dawała złe wyniki niezależnie od strefy czasowej (np. 15 marca 2026: 12
// zamiast poprawnych 11) i dodatkowo psuła się przy niektórych datach przez użycie T12:00:00
// zamiast północy (12 września 2026: 38 zamiast 37) — naprawione 12.09.2026.
function weekOfYear(d) {
  const dt = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dow = dt.getUTCDay() || 7;
  dt.setUTCDate(dt.getUTCDate() + 4 - dow);
  const yearStart = new Date(Date.UTC(dt.getUTCFullYear(), 0, 1));
  return Math.ceil((((dt - yearStart) / 86400000) + 1) / 7);
}

function renderDay(dateStr) {
  const date = new Date(dateStr + 'T12:00:00');
  const d = date.getDate(), m = date.getMonth() + 1, y = date.getFullYear();
  const wd = WEEKDAYS[date.getDay()];
  const doy = dayOfYear(date);
  const woy = weekOfYear(date);
  const daysLeft = (new Date(y, 11, 31) - date) / 86400000;
  const key = m + '-' + d;

  // Hero
  document.getElementById('heroDate').innerHTML = `
    <div>
      <div class="hero-day">${d}</div>
      <div class="hero-month">${MONTHS_GEN[m-1]} ${y}</div>
      <div class="hero-weekday">${wd.charAt(0).toUpperCase() + wd.slice(1)}</div>
    </div>
    <div class="hero-meta">
      <div class="meta-item">Dzień roku<br><span class="meta-val">${doy}</span></div>
      <div class="meta-item">Tydzień<br><span class="meta-val">${woy}</span></div>
      <div class="meta-item">Dni do końca roku<br><span class="meta-val">${Math.round(daysLeft)}</span></div>
    </div>
  `;

  // Imieniny
  const names = NAMES_DB[key] || NAMES_DB[m + '-' + d] || [];
  const namesHTML = names.length
    ? names.map(n => `<a href="${nameHref(n)}" class="name-badge">${n}</a>`).join('')
    : '<span style="color:var(--muted);font-size:.82rem">Brak danych dla tego dnia</span>';

  // Słońce
  const sun = getSunTimes(date);
  const sunHTML = sun
    ? `<div class="sun-row">
        <div class="sun-item"><div class="sun-time">☀️ ${fmtTime(sun.rise)}</div><div class="sun-lbl">Wschód słońca</div></div>
        <div class="sun-item"><div class="sun-time">🌅 ${fmtTime(sun.set)}</div><div class="sun-lbl">Zachód słońca</div></div>
        <div class="sun-item"><div class="sun-time">⏱ ${Math.floor(sun.set-sun.rise)}h ${Math.round(((sun.set-sun.rise)%1)*60)}m</div><div class="sun-lbl">Długość dnia</div></div>
      </div>` : 'Brak danych';

  // Księżyc
  const moon = getMoonPhase(date);
  const moonHTML = `<div class="moon-row"><div class="moon-symbol">${moon.symbol}</div><div class="moon-info"><div class="moon-phase">${moon.phase}</div><div class="moon-age">${moon.age}. dzień cyklu</div></div></div>`;

  // Święta
  // Swieta ruchome licza sie dla wybranego roku (swieta_data.js), nie sa w HOLIDAYS_DB
  const movable = computeMovableSwieta(y).filter(s => s[0] === d && s[1] === m).map(s => s[2]);
  // Swieta o ruchomej dacie (n-ty dzien tygodnia) tez licza sie dla wybranego roku (swieta_floating.js)
  const hols = movable.concat(floatingNamesOn(y, m, d), HOLIDAYS_DB[key] || []);
  const holsHTML = hols.length
    ? `<div class="holiday-list">${hols.map(h => `<div class="holiday-item"><div class="holiday-icon">🎉</div><div>${h}</div></div>`).join('')}</div>`
    : '<span style="color:var(--muted);font-size:.82rem">Brak świąt tego dnia</span>';

  document.getElementById('infoGrid').innerHTML = `
    <div class="info-card">
      <div class="ic-label">🎂 Imieniny</div>
      <div class="names-row">${namesHTML}</div>
    </div>
    <div class="info-card">
      <div class="ic-label">☀️ Słońce — Warszawa</div>
      ${sunHTML}
    </div>
    <div class="info-card">
      <div class="ic-label">🌙 Faza Księżyca</div>
      ${moonHTML}
    </div>
    <div class="info-card">
      <div class="ic-label">🎊 Święta i wydarzenia</div>
      ${holsHTML}
    </div>
  `;

  // Przysłowie
  const provs = PROVERBS_DB[key] || [];
  if (provs.length) {
    document.getElementById('proverbCard').innerHTML = `
      <div class="proverb-card">
        <div class="proverb-label">🌾 Przysłowie na dziś</div>
        <div class="proverb-text">${provs[0]}</div>
        ${provs[1] ? `<div class="proverb-text" style="margin-top:.75rem;font-size:.95rem;color:var(--muted)">${provs[1]}</div>` : ''}
      </div>
    `;
  } else {
    document.getElementById('proverbCard').innerHTML = '';
  }

  // Update nav buttons
  const prev = new Date(date); prev.setDate(prev.getDate() - 1);
  const next = new Date(date); next.setDate(next.getDate() + 1);
  document.getElementById('prevBtn').onclick = () => navigate(prev.toISOString().slice(0,10));
  document.getElementById('nextBtn').onclick = () => navigate(next.toISOString().slice(0,10));
}

function navigate(dateStr) {
  document.getElementById('datePicker').value = dateStr;
  renderDay(dateStr);
}

function goToday() {
  const today = new Date().toISOString().slice(0,10);
  navigate(today);
}

document.getElementById('datePicker').addEventListener('change', function() {
  renderDay(this.value);
});

// Sprawdź URL param
const urlDate = new URLSearchParams(window.location.search).get('date');
if (urlDate) {
  document.getElementById('datePicker').value = urlDate;
  renderDay(urlDate);
} else {
  const today = new Date().toISOString().slice(0,10);
  document.getElementById('datePicker').value = today;
  renderDay(today);
}

// ── Auto-odświeżenie po zmianie daty (karta zostawiona otwarta na noc) ────────
(function(){
  if (urlDate) return; // otwarte z konkretną datą w URL — nie przeszkadzaj
  const loadedDayISO = new Date().toISOString().slice(0,10);
  function checkDate(){
    const picker = document.getElementById('datePicker').value;
    if (picker !== loadedDayISO) return; // użytkownik odnawigował na inny dzień — nie przeszkadzaj
    if (new Date().toISOString().slice(0,10) !== loadedDayISO) location.reload();
  }
  setInterval(checkDate,60000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkDate(); });
})();
</script>

<script>
  function toggleDarkMode(){
    var d=document.documentElement;
    var t=d.getAttribute('data-theme')==='dark'?'light':'dark';
    d.setAttribute('data-theme',t);
    localStorage.setItem('dbd-theme',t);
    updateThemeBtn();
  }
  function updateThemeBtn(){
    var b=document.getElementById('themeToggle');
    if(b) b.setAttribute('aria-label', document.documentElement.getAttribute('data-theme')==='dark'?'Przełącz na tryb jasny':'Przełącz na tryb ciemny');
    if(b) b.textContent=document.documentElement.getAttribute('data-theme')==='dark'?'☀':'☾';
  }
  function cycleFontSize(){
    var sizes=['normal','large','xl'];
    var d=document.documentElement;
    var cur=d.getAttribute('data-font')||'normal';
    var next=sizes[(sizes.indexOf(cur)+1)%sizes.length];
    d.setAttribute('data-font',next);
    localStorage.setItem('dbd-font',next);
    updateFontBtn();
  }
  function updateFontBtn(){
    var b=document.getElementById('fontToggle');
    if(!b) return;
    var f=document.documentElement.getAttribute('data-font')||'normal';
    b.textContent=f==='normal'?'A':f==='large'?'A+':'A++';
    b.setAttribute('aria-label',f==='normal'?'Zwiększ czcionkę':f==='large'?'Jeszcze większa czcionka':'Przywróć domyślną czcionkę');
  }
  (function(){
    updateThemeBtn();
    updateFontBtn();
  })();
</script>
